<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ASPIN BO | Activity History</title>

    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="style.css">

    <style>
        /* ========================================
           ACTIVITY HISTORY
        ======================================== */

        .activity-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 10px;
        }

        .search-box {
            width: min(450px, 100%);
            box-sizing: border-box;
        }

        .activity-refresh {
            padding: 12px 20px;
            border: 1px solid #333;
            background: #181818;
            color: #eee;
            cursor: pointer;
            font-weight: 700;
        }

        .activity-refresh:hover {
            border-color: var(--gold);
            color: var(--gold);
        }

        .activity-refresh:disabled {
            opacity: .55;
            cursor: not-allowed;
        }


        /* ========================================
           STATUS
        ======================================== */

        .activity-status {
            min-height: 18px;
            margin: 0 0 8px;
            color: #888;
            font-size: 12px;
        }


        /* ========================================
           TABLE
        ======================================== */

        .activity-table-wrap {
            width: 100%;
            overflow-x: auto;
            border: 1px solid #292929;
            background: #101010;
        }

        .activity-table {
            width: 100%;
            min-width: 850px;
            border-collapse: collapse;
            table-layout: fixed;
        }

        .activity-table th {
            padding: 12px;
            background: #171717;
            border-bottom: 1px solid #292929;
            color: #aaa;
            font-size: 11px;
            letter-spacing: .08em;
            font-weight: 700;
            text-align: left;
            white-space: nowrap;
        }

        .activity-table td {
            padding: 13px 12px;
            border-bottom: 1px solid #292929;
            color: #eee;
            font-size: 13px;
            vertical-align: middle;
        }

        .activity-table tbody tr:last-child td {
            border-bottom: 0;
        }

        .activity-table tbody tr:hover {
            background: rgba(255,255,255,.025);
        }


        /* ========================================
           COLUMN WIDTHS
        ======================================== */

        .activity-table th:nth-child(1),
        .activity-table td:nth-child(1) {
            width: 165px;
        }

        .activity-table th:nth-child(2),
        .activity-table td:nth-child(2) {
            width: 125px;
        }

        .activity-table th:nth-child(3),
        .activity-table td:nth-child(3) {
            width: 80px;
        }

        .activity-table th:nth-child(4),
        .activity-table td:nth-child(4) {
            width: 105px;
        }

        .activity-table th:nth-child(5),
        .activity-table td:nth-child(5) {
            width: auto;
        }


        /* ========================================
           CELLS
        ======================================== */

        .activity-date {
            white-space: nowrap;
        }

        .activity-user {
            white-space: nowrap;
            font-weight: 600;
        }

        .activity-action {
            white-space: nowrap;
            font-weight: 700;
        }

        .activity-ip {
            white-space: nowrap;
        }


        /* ========================================
           DEVICE / BROWSER
        ======================================== */

        .device-cell {
            width: 100%;
        }

        .device-row {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
            min-width: 0;
        }

        .device-preview {
            flex: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: #eee;
        }

        .device-toggle {
            flex-shrink: 0;
            padding: 5px 9px;
            border: 1px solid #3a3a3a;
            background: #171717;
            color: var(--gold);
            font-size: 10px;
            font-weight: 700;
            letter-spacing: .04em;
            cursor: pointer;
        }

        .device-toggle:hover {
            border-color: var(--gold);
            background: #1d1d1d;
        }

        .device-full {
            display: none;
            margin-top: 7px;
            color: #aaa;
            line-height: 1.45;
            word-break: break-word;
        }

        .device-cell.expanded .device-full {
            display: block;
        }

        .device-cell.expanded .device-preview {
            white-space: normal;
            overflow: visible;
            text-overflow: unset;
        }


        /* ========================================
           EMPTY / LOADING / ERROR
        ======================================== */

        .activity-loading,
        .activity-empty,
        .activity-error {
            padding: 30px 20px !important;
            text-align: center;
            color: #888 !important;
        }

        .activity-error {
            color: #ff6f78 !important;
        }


        /* ========================================
           PAGINATION
        ======================================== */

        .activity-pagination {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            margin-top: 18px;
        }

        .pagination-btn {
            min-width: 105px;
            padding: 11px 16px;
            border: 1px solid #333;
            background: #171717;
            color: #eee;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
        }

        .pagination-btn:hover:not(:disabled) {
            border-color: var(--gold);
            color: var(--gold);
        }

        .pagination-btn:disabled {
            opacity: .35;
            cursor: not-allowed;
        }

        .pagination-info {
            min-width: 110px;
            text-align: center;
            color: #aaa;
            font-size: 12px;
            font-weight: 700;
        }


        /* ========================================
           MOBILE
        ======================================== */

        @media (max-width: 700px) {

            .activity-toolbar {
                align-items: stretch;
                flex-direction: column;
            }

            .search-box {
                width: 100%;
            }

            .activity-refresh {
                width: 100%;
            }

            .activity-table {
                min-width: 850px;
            }

            .activity-pagination {
                margin-bottom: 20px;
            }

        }
    </style>
</head>


<body>

    <div class="admin-layout">

        <!-- ========================================
             SIDEBAR
        ======================================== -->

        <aside class="sidebar">

            <div class="sidebar-brand">

                <img
                    src="favicon.png"
                    alt="ASPIN"
                    class="sidebar-logo"
                >

                <div class="sidebar-brand-text">

                    <strong>ASPIN.SITE</strong>

                    <span>BACK OFFICE</span>

                </div>

            </div>


            <nav>

                <a href="index.html">
                    Dashboard
                </a>

                <a href="promotions.html">
                    Promotions
                </a>

                <a href="media.html">
                    Media
                </a>

                <a href="faqs.html">
                    FAQs
                </a>

                <a href="payments.html">
                    Payments
                </a>

                <a href="subscribers.html">
                    Subscribers
                </a>

                <a href="analytics.html">
                    Analytics
                </a>

                <a
                    href="activity.html"
                    class="active"
                >
                    Activity History
                </a>

                <a href="settings.html">
                    Settings
                </a>

            </nav>


            <button
                id="logoutBtn"
                class="logout-btn"
                type="button"
            >
                LOG OUT
            </button>

        </aside>


        <!-- ========================================
             MAIN
        ======================================== -->

        <main class="admin-main">

            <header class="page-header">

                <div>

                    <div class="eyebrow">
                        ASPIN.SITE
                    </div>

                    <h1>
                        Activity History
                    </h1>

                    <p>
                        Authentication activity recorded for the ASPIN.SITE Back Office.
                    </p>

                </div>

            </header>


            <!-- ========================================
                 SEARCH / REFRESH
            ======================================== -->

            <div class="activity-toolbar">

                <input
                    id="activitySearch"
                    class="search-box"
                    type="search"
                    placeholder="Search activity, user, IP address..."
                    autocomplete="off"
                >

                <button
                    id="refreshBtn"
                    class="activity-refresh"
                    type="button"
                >
                    REFRESH
                </button>

            </div>


            <div
                id="activityStatus"
                class="activity-status"
            ></div>


            <!-- ========================================
                 TABLE
            ======================================== -->

            <div class="activity-table-wrap">

                <table class="activity-table">

                    <thead>

                        <tr>

                            <th>
                                DATE &amp; TIME
                            </th>

                            <th>
                                USER
                            </th>

                            <th>
                                ACTIVITY
                            </th>

                            <th>
                                IP ADDRESS
                            </th>

                            <th>
                                DEVICE / BROWSER
                            </th>

                        </tr>

                    </thead>


                    <tbody id="activityBody">

                        <tr>

                            <td
                                colspan="5"
                                class="activity-loading"
                            >
                                Loading activity...
                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>


            <!-- ========================================
                 PAGINATION
            ======================================== -->

            <div
                id="pagination"
                class="activity-pagination"
            >

                <button
                    id="previousBtn"
                    class="pagination-btn"
                    type="button"
                >
                    ← PREVIOUS
                </button>


                <div
                    id="paginationInfo"
                    class="pagination-info"
                >
                    PAGE 1 OF 1
                </div>


                <button
                    id="nextBtn"
                    class="pagination-btn"
                    type="button"
                >
                    NEXT →
                </button>

            </div>

        </main>

    </div>


    <!-- ========================================
         SUPABASE
    ======================================== -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
    <script src="mobile-menu.js"></script>


    <script>

        // ========================================
        // ELEMENTS
        // ========================================

        const activityBody =
            document.getElementById(
                "activityBody"
            );

        const activitySearch =
            document.getElementById(
                "activitySearch"
            );

        const refreshBtn =
            document.getElementById(
                "refreshBtn"
            );

        const activityStatus =
            document.getElementById(
                "activityStatus"
            );

        const previousBtn =
            document.getElementById(
                "previousBtn"
            );

        const nextBtn =
            document.getElementById(
                "nextBtn"
            );

        const paginationInfo =
            document.getElementById(
                "paginationInfo"
            );


        // ========================================
        // SETTINGS
        // ========================================

        const RECORDS_PER_PAGE = 50;

        let currentPage = 1;

        let totalRecords = 0;

        let totalPages = 1;

        let currentSearch = "";


        // ========================================
        // DATE FORMAT
        // ========================================

        function formatDate(value) {

            if (!value) {
                return "Unknown";
            }


            const date =
                new Date(value);


            if (
                Number.isNaN(
                    date.getTime()
                )
            ) {

                return "Unknown";

            }


            return date.toLocaleString(
                "en-US",
                {
                    month: "short",
                    day: "numeric",
                    year: "numeric",
                    hour: "2-digit",
                    minute: "2-digit",
                    second: "2-digit"
                }
            );
        }


        // ========================================
        // UPDATE PAGINATION
        // ========================================

        function updatePagination() {

            totalPages =
                Math.max(
                    1,
                    Math.ceil(
                        totalRecords /
                        RECORDS_PER_PAGE
                    )
                );


            if (
                currentPage >
                totalPages
            ) {

                currentPage =
                    totalPages;

            }


            paginationInfo.textContent =
                `PAGE ${currentPage} OF ${totalPages}`;


            previousBtn.disabled =
                currentPage <= 1;


            nextBtn.disabled =
                currentPage >= totalPages;


            if (totalRecords === 0) {

                paginationInfo.textContent =
                    "PAGE 1 OF 1";

            }
        }


        // ========================================
        // SEARCH FILTER
        // ========================================

        function buildSearchFilter(query) {

            if (!query) {
                return null;
            }


            /*
             * Escape characters that could interfere
             * with the Supabase PostgREST filter.
             */

            const escaped =
                query
                    .replace(/\\/g, "")
                    .replace(/,/g, "")
                    .replace(/\(/g, "")
                    .replace(/\)/g, "")
                    .replace(/%/g, "");


            return [
                `user_email.ilike.%${escaped}%`,
                `action.ilike.%${escaped}%`,
                `ip_address.ilike.%${escaped}%`,
                `user_agent.ilike.%${escaped}%`
            ].join(",");
        }


        // ========================================
        // LOAD ACTIVITY
        // ========================================

        async function loadActivity() {

            /*
             * Make sure the user is authenticated.
             */

            const session =
                await requireAdmin();


            if (!session) {
                return;
            }


            refreshBtn.disabled =
                true;

            refreshBtn.textContent =
                "LOADING...";


            activityBody.innerHTML = `
                <tr>
                    <td
                        colspan="5"
                        class="activity-loading"
                    >
                        Loading activity...
                    </td>
                </tr>
            `;


            try {

                /*
                 * Use ONLY the custom activity table.
                 *
                 * This prevents duplicate Auth Audit
                 * Log records from appearing.
                 */

                let query =
                    supabaseClient
                        .from(
                            "admin_activity_logs"
                        )
                        .select(
                            `
                            id,
                            created_at,
                            user_id,
                            user_email,
                            action,
                            ip_address,
                            user_agent
                            `,
                            {
                                count: "exact"
                            }
                        );


                // ========================================
                // SEARCH
                // ========================================

                if (currentSearch) {

                    const searchFilter =
                        buildSearchFilter(
                            currentSearch
                        );


                    if (searchFilter) {

                        query =
                            query.or(
                                searchFilter
                            );

                    }

                }


                // ========================================
                // NEWEST FIRST
                // ========================================

                query =
                    query.order(
                        "created_at",
                        {
                            ascending: false
                        }
                    );


                // ========================================
                // 50 RECORDS PER PAGE
                // ========================================

                const from =
                    (
                        currentPage -
                        1
                    ) *
                    RECORDS_PER_PAGE;


                const to =
                    from +
                    RECORDS_PER_PAGE -
                    1;


                query =
                    query.range(
                        from,
                        to
                    );


                // ========================================
                // EXECUTE
                // ========================================

                const {
                    data,
                    error,
                    count
                } =
                    await query;


                if (error) {
                    throw error;
                }


                totalRecords =
                    count || 0;


                updatePagination();


                renderActivity(
                    data || []
                );


                // ========================================
                // STATUS
                // ========================================

                if (currentSearch) {

                    activityStatus.textContent =
                        `${totalRecords.toLocaleString()} matching record${totalRecords === 1 ? "" : "s"}`;

                } else {

                    activityStatus.textContent =
                        `${totalRecords.toLocaleString()} activity record${totalRecords === 1 ? "" : "s"}`;

                }


            } catch (error) {

                console.error(
                    "Activity history loading failed:",
                    error
                );


                totalRecords =
                    0;


                updatePagination();


                activityBody.innerHTML = `
                    <tr>
                        <td
                            colspan="5"
                            class="activity-error"
                        >
                            Unable to load activity history.
                        </td>
                    </tr>
                `;


                activityStatus.textContent =
                    error.message ||
                    "Unable to load activity history.";

            } finally {

                refreshBtn.disabled =
                    false;

                refreshBtn.textContent =
                    "REFRESH";

            }
        }


        // ========================================
        // RENDER ACTIVITY
        // ========================================

        function renderActivity(data) {

            activityBody.innerHTML =
                "";


            if (!data.length) {

                const row =
                    document.createElement(
                        "tr"
                    );


                const cell =
                    document.createElement(
                        "td"
                    );


                cell.colSpan =
                    5;

                cell.className =
                    "activity-empty";


                cell.textContent =
                    currentSearch
                        ? "No matching activity found."
                        : "No activity found.";


                row.appendChild(
                    cell
                );


                activityBody.appendChild(
                    row
                );


                return;
            }


            data.forEach(
                activity => {

                    const row =
                        document.createElement(
                            "tr"
                        );


                    // ========================================
                    // DATE
                    // ========================================

                    const dateCell =
                        document.createElement(
                            "td"
                        );


                    dateCell.className =
                        "activity-date";


                    dateCell.textContent =
                        formatDate(
                            activity.created_at
                        );


                    // ========================================
                    // USER
                    // ========================================

                    const userCell =
                        document.createElement(
                            "td"
                        );


                    userCell.className =
                        "activity-user";


                    userCell.textContent =
                        activity.user_email ||
                        "Unknown";


                    // ========================================
                    // ACTIVITY
                    // ========================================

                    const actionCell =
                        document.createElement(
                            "td"
                        );


                    actionCell.className =
                        "activity-action";


                    actionCell.textContent =
                        activity.action ||
                        "UNKNOWN";


                    // ========================================
                    // IP ADDRESS
                    // ========================================

                    const ipCell =
                        document.createElement(
                            "td"
                        );


                    ipCell.className =
                        "activity-ip";


                    ipCell.textContent =
                        activity.ip_address ||
                        "Unavailable";


                    // ========================================
                    // DEVICE / BROWSER
                    // ========================================

                    const deviceCell =
                        document.createElement(
                            "td"
                        );


                    deviceCell.className =
                        "device-cell";


                    const deviceRow =
                        document.createElement(
                            "div"
                        );


                    deviceRow.className =
                        "device-row";


                    const preview =
                        document.createElement(
                            "span"
                        );


                    preview.className =
                        "device-preview";


                    const userAgent =
                        activity.user_agent ||
                        "Unavailable";


                    preview.textContent =
                        userAgent;


                    const toggle =
                        document.createElement(
                            "button"
                        );


                    toggle.type =
                        "button";


                    toggle.className =
                        "device-toggle";


                    toggle.textContent =
                        "VIEW";


                    const fullText =
                        document.createElement(
                            "div"
                        );


                    fullText.className =
                        "device-full";


                    fullText.textContent =
                        userAgent;


                    toggle.addEventListener(
                        "click",
                        function () {

                            const expanded =
                                deviceCell.classList.toggle(
                                    "expanded"
                                );


                            toggle.textContent =
                                expanded
                                    ? "HIDE"
                                    : "VIEW";

                        }
                    );


                    deviceRow.appendChild(
                        preview
                    );


                    deviceRow.appendChild(
                        toggle
                    );


                    deviceCell.appendChild(
                        deviceRow
                    );


                    deviceCell.appendChild(
                        fullText
                    );


                    // ========================================
                    // APPEND CELLS
                    // ========================================

                    row.appendChild(
                        dateCell
                    );

                    row.appendChild(
                        userCell
                    );

                    row.appendChild(
                        actionCell
                    );

                    row.appendChild(
                        ipCell
                    );

                    row.appendChild(
                        deviceCell
                    );


                    activityBody.appendChild(
                        row
                    );

                }
            );
        }


        // ========================================
        // SEARCH
        // ========================================

        let searchTimer;


        activitySearch.addEventListener(
            "input",
            function () {

                clearTimeout(
                    searchTimer
                );


                searchTimer =
                    setTimeout(
                        function () {

                            currentSearch =
                                activitySearch.value
                                    .trim();


                            currentPage =
                                1;


                            loadActivity();

                        },
                        300
                    );

            }
        );


        // ========================================
        // PREVIOUS
        // ========================================

        previousBtn.addEventListener(
            "click",
            function () {

                if (
                    currentPage <= 1
                ) {

                    return;

                }


                currentPage--;


                loadActivity();

            }
        );


        // ========================================
        // NEXT
        // ========================================

        nextBtn.addEventListener(
            "click",
            function () {

                if (
                    currentPage >=
                    totalPages
                ) {

                    return;

                }


                currentPage++;


                loadActivity();

            }
        );


        // ========================================
        // REFRESH
        // ========================================

        refreshBtn.addEventListener(
            "click",
            function () {

                loadActivity();

            }
        );


        // ========================================
        // INITIAL LOAD
        // ========================================

        loadActivity();

    </script>

</body>

</html>
