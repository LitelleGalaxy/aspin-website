<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ASPIN BO | Promotions</title>

  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="style.css">

  <style>
    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      gap: 20px;
    }

    .page-header h1 {
      margin: 0;
    }

    .page-header p {
      margin: 8px 0 0;
      color: #999;
    }

    .primary-btn {
      background: #b10d16;
      color: #fff;
      border: 1px solid #d4af37;
      padding: 13px 20px;
      cursor: pointer;
      font-weight: 700;
      letter-spacing: 1px;
      transition: 0.2s ease;
    }

    .primary-btn:hover {
      background: #d1111c;
    }

    .primary-btn:disabled,
    .secondary-btn:disabled,
    .danger-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .secondary-btn {
      background: transparent;
      color: #d4af37;
      border: 1px solid #d4af37;
      padding: 11px 18px;
      cursor: pointer;
      font-weight: 700;
      transition: 0.2s ease;
    }

    .secondary-btn:hover {
      background: rgba(212, 175, 55, 0.08);
    }

    .danger-btn {
      background: transparent;
      color: #ff6b6b;
      border: 1px solid #7c2727;
      padding: 10px 15px;
      cursor: pointer;
      font-weight: 700;
      transition: 0.2s ease;
    }

    .danger-btn:hover {
      background: rgba(180, 30, 30, 0.15);
    }

    .promotions-list {
      display: grid;
      gap: 18px;
    }

    .promotion-card {
      background: #111;
      border: 1px solid #3a3020;
      display: grid;
      grid-template-columns: 220px 1fr auto;
      min-height: 150px;
    }

    .promotion-image {
      width: 220px;
      height: 150px;
      object-fit: cover;
      background: #080808;
    }

    .promotion-image.placeholder {
      display: flex;
      align-items: center;
      justify-content: center;
      color: #666;
    }

    .promotion-content {
      padding: 20px;
    }

    .promotion-label {
      color: #d4af37;
      font-size: 11px;
      letter-spacing: 2px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .promotion-content h2 {
      margin: 0 0 8px;
      font-size: 20px;
    }

    .promotion-content p {
      color: #aaa;
      margin: 0 0 12px;
      line-height: 1.5;
    }

    .promotion-meta {
      color: #777;
      font-size: 12px;
    }

    .promotion-actions {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 8px;
      padding: 20px;
      min-width: 130px;
    }

    .status {
      display: inline-block;
      padding: 5px 9px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .status.published {
      color: #65e89a;
      border: 1px solid #27643f;
      background: rgba(50, 150, 90, 0.08);
    }

    .status.draft {
      color: #d4af37;
      border: 1px solid #715e21;
      background: rgba(212, 175, 55, 0.06);
    }

    .empty-state {
      border: 1px dashed #3a3020;
      padding: 60px 20px;
      text-align: center;
      color: #777;
    }

    .empty-state h2 {
      color: #ddd;
      margin-bottom: 8px;
    }

    .loading {
      color: #d4af37;
      padding: 30px 0;
    }

    .error-message {
      color: #ff7777;
      background: rgba(150, 20, 20, 0.12);
      border: 1px solid #632323;
      padding: 15px;
      margin-bottom: 20px;
      display: none;
    }

    /* Modal */

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.82);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 9999;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal {
      width: min(700px, 100%);
      max-height: 90vh;
      overflow-y: auto;
      background: #111;
      border: 1px solid #4a3d22;
      padding: 30px;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
    }

    .modal-header h2 {
      margin: 0;
    }

    .close-btn {
      background: transparent;
      border: 0;
      color: #aaa;
      font-size: 25px;
      cursor: pointer;
      line-height: 1;
    }

    .close-btn:hover {
      color: #fff;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      margin-bottom: 7px;
      color: #ddd;
      font-size: 12px;
      letter-spacing: 1px;
      font-weight: 700;
    }

    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;
      box-sizing: border-box;
      background: #080808;
      color: #fff;
      border: 1px solid #3a3a3a;
      padding: 12px;
      font-family: inherit;
      outline: none;
    }

    .form-group input:focus,
    .form-group textarea:focus,
    .form-group select:focus {
      border-color: #d4af37;
      box-shadow: 0 0 0 1px rgba(212, 175, 55, 0.15);
    }

    .form-group textarea {
      min-height: 110px;
      resize: vertical;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .upload-box {
      border: 1px dashed #5a4a26;
      padding: 18px;
      background: #0a0a0a;
    }

    .image-preview {
      width: 100%;
      max-height: 220px;
      object-fit: contain;
      background: #050505;
      margin-top: 12px;
      display: none;
    }

    .upload-status {
      color: #d4af37;
      font-size: 12px;
      margin-top: 8px;
    }

    .upload-status.error {
      color: #ff7777;
    }

    .upload-status.success {
      color: #65e89a;
    }

    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 20px 0;
      cursor: pointer;
    }

    .checkbox-row input {
      width: auto;
      cursor: pointer;
    }

    .action-type-row {
      display: grid;
      grid-template-columns: 180px 1fr;
      gap: 10px;
      align-items: start;
    }

    .action-content {
      display: none;
    }

    .action-content.active {
      display: block;
    }

    .publish-actions {
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      gap: 10px;
      margin-top: 25px;
      border-top: 1px solid #292929;
      padding-top: 20px;
    }

    .publish-btn,
    .draft-btn,
    .cancel-btn {
      min-height: 48px;
      padding: 12px 18px;
      cursor: pointer;
      font-weight: 800;
      letter-spacing: 1px;
      transition: 0.2s ease;
    }

    .publish-btn {
      background: #b10d16;
      color: #fff;
      border: 1px solid #d4af37;
    }

    .publish-btn:hover {
      background: #d1111c;
    }

    .draft-btn {
      background: transparent;
      color: #d4af37;
      border: 1px solid #d4af37;
    }

    .draft-btn:hover {
      background: rgba(212, 175, 55, 0.08);
    }

    .cancel-btn {
      background: transparent;
      color: #aaa;
      border: 1px solid #555;
    }

    .cancel-btn:hover {
      color: #fff;
      border-color: #888;
    }

    .publish-actions button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .field-error {
      display: none;
      margin-top: 7px;
      color: #ff5b5b;
      font-size: 12px;
      font-weight: 700;
      line-height: 1.4;
    }

    .field-error.active {
      display: block;
    }

    .input-error {
      border-color: #ff3b3b !important;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 25px;
      border-top: 1px solid #292929;
      padding-top: 20px;
    }

    @media (max-width: 800px) {
      .page-header {
        align-items: flex-start;
        flex-direction: column;
      }

      .promotion-card {
        grid-template-columns: 1fr;
      }

      .promotion-image {
        width: 100%;
        height: 200px;
      }

      .promotion-actions {
        flex-direction: row;
        flex-wrap: wrap;
        padding-top: 0;
      }

      .form-row {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 500px) {
      .modal {
        padding: 20px;
      }

      .modal-actions {
        flex-direction: column-reverse;
      }

      .modal-actions button {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <div class="admin-layout">

    <!-- SIDEBAR -->
    <aside class="sidebar">

      <div class="sidebar-brand">

    <img
        src="favicon.png"
        alt="ASPIN"
        class="sidebar-logo"
    >

    <div class="sidebar-brand-text">
        <strong>ASPIN.SITE</strong>
        <span>BACK OFFICE</span>
    </div>

</div>

      <nav class="admin-nav">
        <a href="index.html">Dashboard</a>
        <a href="promotions.html">Promotions</a>
        <a href="media.html">Media</a>
        <a href="faqs.html">FAQs</a>
        <a href="payments.html">Payments</a>
        <a href="subscribers.html">Subscribers</a>
        <a href="analytics.html">Analytics</a>
        <a href="activity.html">Activity History</a>
        <a href="settings.html">Settings</a>
      </nav>

      <button id="logoutBtn" class="logout-btn">
        LOG OUT
      </button>

    </aside>


    <!-- MAIN -->
    <main class="admin-main">

      <header class="page-header">

        <div>
          <div class="eyebrow">ASPIN.SITE</div>

          <h1>Promotions</h1>

          <p>
            Manage the promotional content displayed on the website.
          </p>
        </div>

        <button
          id="addPromotionBtn"
          class="primary-btn"
          type="button"
        >
          + ADD PROMOTION
        </button>

      </header>


      <div id="errorMessage" class="error-message"></div>

      <div id="loading" class="loading">
        Loading promotions...
      </div>

      <section
        id="promotionsList"
        class="promotions-list"
      ></section>

    </main>

  </div>


  <!-- ADD / EDIT MODAL -->

  <div
    id="promotionModal"
    class="modal-overlay"
    role="dialog"
    aria-modal="true"
    aria-labelledby="modalTitle"
  >

    <div class="modal">

      <div class="modal-header">

        <h2 id="modalTitle">
          Add Promotion
        </h2>

        <button
          id="closeModalBtn"
          class="close-btn"
          type="button"
          aria-label="Close"
        >
          ×
        </button>

      </div>


      <form id="promotionForm">

        <input
          type="hidden"
          id="promotionId"
        >


        <div class="form-group">

          <label for="title">
            PROMOTION TITLE
          </label>

          <input
            id="title"
            type="text"
            placeholder="September Welcome Bonus"
            maxlength="150"
            required
          >

        </div>


        <div class="form-group">

          <label for="description">
            DESCRIPTION
          </label>

          <textarea
            id="description"
            placeholder="Enter the promotion description..."
            maxlength="1000"
          ></textarea>

        </div>


        <div class="form-group">

          <label for="imageFile">
            PROMOTION IMAGE
          </label>

          <div class="upload-box">

            <input
              id="imageFile"
              type="file"
              accept="image/jpeg,image/png,image/webp,image/svg+xml"
            >

            <div
              id="uploadStatus"
              class="upload-status"
            ></div>

            <img
              id="imagePreview"
              class="image-preview"
              alt="Promotion preview"
            >

          </div>

        </div>


        <div class="form-row">

          <div class="form-group">

            <label for="label">
              LABEL
            </label>

            <input
              id="label"
              type="text"
              value="FEATURED"
              placeholder="FEATURED"
              maxlength="50"
            >

          </div>


          <div class="form-group">

            <label for="buttonText">
              BUTTON TEXT
            </label>

            <input
              id="buttonText"
              type="text"
              value="LEARN MORE"
              placeholder="LEARN MORE"
              maxlength="50"
            >

          </div>

        </div>


        <div class="form-group">

          <label for="buttonActionType">
            BUTTON ACTION
          </label>

          <div class="action-type-row">

            <select id="buttonActionType">
              <option value="url">OPEN EXTERNAL URL</option>
              <option value="content">OPEN LONG DESCRIPTION</option>
            </select>

            <div id="buttonUrlWrap" class="action-content active">
              <input
                id="buttonUrl"
                type="url"
                value="https://aspin.vip/"
                placeholder="https://aspin.vip/"
              >
            </div>

            <div id="buttonContentWrap" class="action-content">
              <textarea
                id="buttonContent"
                placeholder="Enter the full promotion details..."
                maxlength="10000"
              ></textarea>
              <div id="buttonContentError" class="field-error"></div>
            </div>

          </div>
          <div id="buttonActionError" class="field-error"></div>

        </div>


        <div class="form-group">

          <label for="termsActionType">
            TERMS & CONDITIONS
          </label>

          <div class="action-type-row">

            <select id="termsActionType">
              <option value="url">OPEN EXTERNAL URL</option>
              <option value="content">OPEN FULL TERMS</option>
            </select>

            <div id="termsUrlWrap" class="action-content active">
              <input
                id="termsUrl"
                type="url"
                placeholder="https://example.com/terms"
              >
            </div>

            <div id="termsContentWrap" class="action-content">
              <textarea
                id="termsContent"
                placeholder="Enter the full terms and conditions..."
                maxlength="20000"
              ></textarea>
              <div id="termsContentError" class="field-error"></div>
            </div>

          </div>
          <div id="termsActionError" class="field-error"></div>

        </div>


        <div class="form-row">

          <div class="form-group">
            <label for="startDate">START DATE</label>
            <input id="startDate" type="date">
          </div>

          <div class="form-group">
            <label for="endDate">END DATE</label>
            <input id="endDate" type="date">
          </div>

        </div>


        <div class="form-group">

          <label for="isActive">
            STATUS
          </label>

          <select id="isActive">
            <option value="true">ACTIVE</option>
            <option value="false">INACTIVE</option>
          </select>

        </div>


        <div class="form-group">

          <label for="sortOrder">
            SORT ORDER
          </label>

          <input
            id="sortOrder"
            type="number"
            value="0"
            min="0"
            step="1"
          >

        </div>


        <div class="publish-actions">

          <button
            type="submit"
            id="publishBtn"
            class="publish-btn"
            data-publish-state="true"
          >
            PUBLISH
          </button>

          <button
            type="submit"
            id="draftBtn"
            class="draft-btn"
            data-publish-state="false"
          >
            SAVE DRAFT
          </button>

          <button
            type="button"
            id="cancelBtn"
            class="cancel-btn"
          >
            CANCEL
          </button>

        </div>

      </form>

    </div>

  </div>


  <!-- SUPABASE -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
  <script src="mobile-menu.js"></script>

  <script>

    let currentPromotions = [];
    let editingPromotion = null;


    const modal =
      document.getElementById("promotionModal");

    const form =
      document.getElementById("promotionForm");

    const titleInput =
      document.getElementById("title");

    const descriptionInput =
      document.getElementById("description");

    const labelInput =
      document.getElementById("label");

    const buttonTextInput =
      document.getElementById("buttonText");

    const buttonActionTypeInput =
      document.getElementById("buttonActionType");

    const buttonUrlInput =
      document.getElementById("buttonUrl");

    const buttonContentInput =
      document.getElementById("buttonContent");

    const termsActionTypeInput =
      document.getElementById("termsActionType");

    const termsUrlInput =
      document.getElementById("termsUrl");

    const termsContentInput =
      document.getElementById("termsContent");

    const startDateInput =
      document.getElementById("startDate");

    const endDateInput =
      document.getElementById("endDate");

    const isActiveInput =
      document.getElementById("isActive");

    const sortOrderInput =
      document.getElementById("sortOrder");

    const publishBtn =
      document.getElementById("publishBtn");

    const draftBtn =
      document.getElementById("draftBtn");

    let publishState = false;

    const imageFileInput =
      document.getElementById("imageFile");

    const imagePreview =
      document.getElementById("imagePreview");

    const uploadStatus =
      document.getElementById("uploadStatus");

    const promotionsList =
      document.getElementById("promotionsList");

    const loading =
      document.getElementById("loading");

    const errorMessage =
      document.getElementById("errorMessage");


    function showError(message) {

      errorMessage.textContent = message;
      errorMessage.style.display = "block";

    }


    function hideError() {

      errorMessage.textContent = "";
      errorMessage.style.display = "none";

    }


    function setUploadStatus(message, type = "") {

      uploadStatus.textContent = message;
      uploadStatus.className =
        "upload-status" +
        (type ? ` ${type}` : "");

    }


    async function checkAuth() {

      try {

        const {
          data: { session },
          error
        } = await supabaseClient.auth.getSession();

        if (error) {
          throw error;
        }

        if (!session) {

          window.location.href = "login.html";

          return false;
        }

        return true;

      } catch (error) {

        showError(
          "Unable to verify authentication: " +
          error.message
        );

        return false;

      }

    }


    async function loadPromotions() {

      hideError();

      loading.style.display = "block";

      promotionsList.innerHTML = "";

      try {

        const {
          data,
          error
        } = await supabaseClient
          .from("promotions")
          .select("*")
          .order("sort_order", {
            ascending: true
          })
          .order("created_at", {
            ascending: false
          });

        if (error) {
          throw error;
        }

        currentPromotions = data || [];

        renderPromotions();

      } catch (error) {

        showError(
          "Unable to load promotions: " +
          error.message
        );

      } finally {

        loading.style.display = "none";

      }

    }


    function renderPromotions() {

      promotionsList.innerHTML = "";

      if (currentPromotions.length === 0) {

        promotionsList.innerHTML = `
          <div class="empty-state">

            <h2>No promotions yet</h2>

            <p>
              Create your first promotion to display it on ASPIN.SITE.
            </p>

          </div>
        `;

        return;
      }


      currentPromotions.forEach(promotion => {

        const card =
          document.createElement("article");

        card.className =
          "promotion-card";


        let image;

        if (promotion.image_url) {

          image = `
            <img
              class="promotion-image"
              src="${escapeHtml(promotion.image_url)}"
              alt="${escapeHtml(promotion.title)}"
              loading="lazy"
            >
          `;

        } else {

          image = `
            <div class="promotion-image placeholder">
              NO IMAGE
            </div>
          `;

        }


        const status =
          promotion.is_published
            ? `<span class="status published">PUBLISHED</span>`
            : `<span class="status draft">DRAFT</span>`;


        card.innerHTML = `

          ${image}

          <div class="promotion-content">

            <div class="promotion-label">
              ${escapeHtml(
                promotion.label || "FEATURED"
              )}
            </div>

            <h2>
              ${escapeHtml(
                promotion.title
              )}
            </h2>

            <p>
              ${escapeHtml(
                promotion.description ||
                "No description."
              )}
            </p>

            ${status}

          </div>


          <div class="promotion-actions">

            <button
              class="secondary-btn edit-btn"
              type="button"
              data-id="${escapeHtml(promotion.id)}"
            >
              EDIT
            </button>

            <button
              class="danger-btn delete-btn"
              type="button"
              data-id="${escapeHtml(promotion.id)}"
            >
              DELETE
            </button>

          </div>

        `;


        const editBtn =
          card.querySelector(".edit-btn");

        const deleteBtn =
          card.querySelector(".delete-btn");


        editBtn.addEventListener(
          "click",
          () => editPromotion(promotion.id)
        );


        deleteBtn.addEventListener(
          "click",
          () => deletePromotion(promotion.id)
        );


        promotionsList.appendChild(card);

      });

    }


    function escapeHtml(value) {

      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    function clearFieldErrors() {

      document.querySelectorAll(".field-error").forEach(error => {
        error.textContent = "";
        error.classList.remove("active");
      });

      document.querySelectorAll(".input-error").forEach(input => {
        input.classList.remove("input-error");
      });

    }


    function showFieldError(elementId, message, inputElement = null) {

      const element = document.getElementById(elementId);

      if (element) {
        element.textContent = message;
        element.classList.add("active");
      }

      if (inputElement) {
        inputElement.classList.add("input-error");
        inputElement.focus();
      }

    }


    function updateActionVisibility() {

      const buttonIsUrl =
        buttonActionTypeInput.value === "url";

      document.getElementById("buttonUrlWrap")
        .classList.toggle("active", buttonIsUrl);

      document.getElementById("buttonContentWrap")
        .classList.toggle("active", !buttonIsUrl);

      const termsIsUrl =
        termsActionTypeInput.value === "url";

      document.getElementById("termsUrlWrap")
        .classList.toggle("active", termsIsUrl);

      document.getElementById("termsContentWrap")
        .classList.toggle("active", !termsIsUrl);
    }


    function openAddModal() {

      editingPromotion = null;

      hideError();
      clearFieldErrors();

      document.getElementById(
        "modalTitle"
      ).textContent = "Add Promotion";

      form.reset();

      document.getElementById(
        "promotionId"
      ).value = "";

      labelInput.value = "FEATURED";

      buttonTextInput.value =
        "LEARN MORE";

      buttonActionTypeInput.value = "url";
      buttonUrlInput.value = "https://aspin.vip/";
      buttonContentInput.value = "";

      termsActionTypeInput.value = "url";
      termsUrlInput.value = "";
      termsContentInput.value = "";

      startDateInput.value = "";
      endDateInput.value = "";
      isActiveInput.value = "true";

      sortOrderInput.value = "0";
      publishState = false;

      updateActionVisibility();

      imageFileInput.value = "";

      imagePreview.style.display =
        "none";

      imagePreview.src = "";

      setUploadStatus("");

      publishBtn.disabled = false;
      draftBtn.disabled = false;
      publishBtn.textContent = "PUBLISH";
      draftBtn.textContent = "SAVE DRAFT";

      modal.classList.add("active");

      setTimeout(() => {
        titleInput.focus();
      }, 50);

    }


    function editPromotion(id) {

      const promotion =
        currentPromotions.find(
          item => String(item.id) === String(id)
        );

      if (!promotion) return;


      editingPromotion = promotion;

      hideError();


      document.getElementById(
        "modalTitle"
      ).textContent = "Edit Promotion";


      document.getElementById(
        "promotionId"
      ).value = promotion.id;


      titleInput.value =
        promotion.title || "";


      descriptionInput.value =
        promotion.description || "";


      labelInput.value =
        promotion.label || "FEATURED";


      buttonTextInput.value =
        promotion.button_text || "LEARN MORE";


      buttonActionTypeInput.value =
        promotion.button_action_type || "url";

      buttonUrlInput.value =
        promotion.button_url || "https://aspin.vip/";

      buttonContentInput.value =
        promotion.button_content || "";

      termsActionTypeInput.value =
        promotion.terms_action_type || "url";

      termsUrlInput.value =
        promotion.terms_url || "";

      termsContentInput.value =
        promotion.terms_content || "";

      startDateInput.value =
        promotion.start_date || "";

      endDateInput.value =
        promotion.end_date || "";

      isActiveInput.value =
        promotion.is_active === false ? "false" : "true";

      sortOrderInput.value =
        promotion.sort_order ?? 0;

      publishState =
        promotion.is_published === true;

      updateActionVisibility();


      imageFileInput.value = "";

      setUploadStatus("");


      if (promotion.image_url) {

        imagePreview.src =
          promotion.image_url;

        imagePreview.style.display =
          "block";

      } else {

        imagePreview.src = "";

        imagePreview.style.display =
          "none";

      }


      publishBtn.disabled = false;
      draftBtn.disabled = false;
      publishBtn.textContent = "PUBLISH";
      draftBtn.textContent = "SAVE DRAFT";


      modal.classList.add("active");

      setTimeout(() => {
        titleInput.focus();
      }, 50);

    }


    async function uploadImage(file) {

      if (!file) return null;


      if (file.size > 10 * 1024 * 1024) {

        throw new Error(
          "Image must be smaller than 10 MB."
        );

      }


      const allowedTypes = [
        "image/jpeg",
        "image/png",
        "image/webp",
        "image/svg+xml"
      ];


      if (!allowedTypes.includes(file.type)) {

        throw new Error(
          "Only JPG, PNG, WEBP, and SVG images are allowed."
        );

      }


      setUploadStatus(
        "Uploading image..."
      );


      const extension =
        file.name
          .split(".")
          .pop()
          .toLowerCase();


      /*
       * Timestamp + random string.
       * This avoids relying on crypto.randomUUID()
       * in local development.
       */

      const randomPart =
        Math.random()
          .toString(36)
          .substring(2, 12);


      const filename =
        `${Date.now()}-${randomPart}.${extension}`;


      const path =
        `promotions/${filename}`;


      const {
        error
      } = await supabaseClient.storage
        .from("media")
        .upload(
          path,
          file,
          {
            cacheControl: "3600",
            upsert: false
          }
        );


      if (error) {
        throw error;
      }


      const {
        data
      } = supabaseClient.storage
        .from("media")
        .getPublicUrl(path);


      setUploadStatus(
        "Image uploaded successfully.",
        "success"
      );


      return data.publicUrl;

    }


    form.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();

        hideError();

        publishBtn.disabled = true;
        draftBtn.disabled = true;

        const clickedButton = event.submitter;

        publishState =
          clickedButton?.dataset.publishState === "true";

        clickedButton.textContent =
          publishState ? "PUBLISHING..." : "SAVING DRAFT...";


        try {

          const id =
            document.getElementById(
              "promotionId"
            ).value;


          let imageUrl =
            editingPromotion?.image_url ||
            null;


          const selectedFile =
            imageFileInput.files[0];


          if (selectedFile) {

            imageUrl =
              await uploadImage(
                selectedFile
              );

          }


          const title =
            titleInput.value.trim();


          if (!title) {

            throw new Error(
              "Promotion title is required."
            );

          }


          const buttonActionType =
            buttonActionTypeInput.value;

          const buttonUrl =
            buttonUrlInput.value.trim();

          const buttonContent =
            buttonContentInput.value.trim();

          const termsActionType =
            termsActionTypeInput.value;

          const termsUrl =
            termsUrlInput.value.trim();

          const termsContent =
            termsContentInput.value.trim();


          clearFieldErrors();

          if (buttonActionType === "url" && buttonUrl) {
            try {
              new URL(buttonUrl);
            } catch {
              showFieldError(
                "buttonActionError",
                "Please enter a valid button URL.",
                buttonUrlInput
              );
              publishBtn.disabled = false;
              draftBtn.disabled = false;
              publishBtn.textContent = "PUBLISH";
              draftBtn.textContent = "SAVE DRAFT";
              return;
            }
          }


          if (termsActionType === "url" && termsUrl) {
            try {
              new URL(termsUrl);
            } catch {
              showFieldError(
                "termsActionError",
                "Please enter a valid Terms & Conditions URL.",
                termsUrlInput
              );
              publishBtn.disabled = false;
              draftBtn.disabled = false;
              publishBtn.textContent = "PUBLISH";
              draftBtn.textContent = "SAVE DRAFT";
              return;
            }
          }


          if (buttonActionType === "content" && !buttonContent) {
            showFieldError(
              "buttonContentError",
              "Please enter the long description for the button.",
              buttonContentInput
            );
            publishBtn.disabled = false;
            draftBtn.disabled = false;
            publishBtn.textContent = "PUBLISH";
            draftBtn.textContent = "SAVE DRAFT";
            return;
          }


          if (termsActionType === "content" && !termsContent) {
            showFieldError(
              "termsContentError",
              "Please enter the full Terms & Conditions.",
              termsContentInput
            );
            publishBtn.disabled = false;
            draftBtn.disabled = false;
            publishBtn.textContent = "PUBLISH";
            draftBtn.textContent = "SAVE DRAFT";
            return;
          }


          if (
            startDateInput.value &&
            endDateInput.value &&
            endDateInput.value < startDateInput.value
          ) {
            throw new Error(
              "End date cannot be earlier than the start date."
            );
          }


          const promotionData = {

            title,

            description:
              descriptionInput.value.trim() || null,

            image_url:
              imageUrl,

            button_text:
              buttonTextInput.value.trim() || "LEARN MORE",

            button_action_type:
              buttonActionType,

            button_url:
              buttonUrl || null,

            button_content:
              buttonContent || null,

            terms_action_type:
              termsActionType,

            terms_url:
              termsUrl || null,

            terms_content:
              termsContent || null,

            start_date:
              startDateInput.value || null,

            end_date:
              endDateInput.value || null,

            is_active:
              isActiveInput.value === "true",

            label:
              labelInput.value.trim() || "FEATURED",

            sort_order:
              Math.max(
                0,
                Number(sortOrderInput.value) || 0
              ),

            is_published:
              publishState,

            updated_at:
              new Date().toISOString()

          };


          let result;


          if (id) {

            result =
              await supabaseClient
                .from("promotions")
                .update(promotionData)
                .eq("id", id);

          } else {

            result =
              await supabaseClient
                .from("promotions")
                .insert(
                  promotionData
                );

          }


          if (result.error) {
            throw result.error;
          }


          closeModal();

          await loadPromotions();

        }

        catch (error) {

          showError(
            "Unable to save promotion: " +
            error.message
          );

          publishBtn.disabled = false;
          draftBtn.disabled = false;
          publishBtn.textContent = "PUBLISH";
          draftBtn.textContent = "SAVE DRAFT";

        }

      }
    );


    async function deletePromotion(id) {

      const promotion =
        currentPromotions.find(
          item => String(item.id) === String(id)
        );


      if (!promotion) return;


      const confirmed =
        confirm(
          `Delete "${promotion.title}"?\n\nThis cannot be undone.`
        );


      if (!confirmed) return;


      hideError();


      try {

        const {
          error
        } = await supabaseClient
          .from("promotions")
          .delete()
          .eq("id", id);


        if (error) {
          throw error;
        }


        /*
         * Delete the associated image
         * after the database record is removed.
         */

        if (promotion.image_url) {

          try {

            const marker =
              "/storage/v1/object/public/media/";


            const index =
              promotion.image_url.indexOf(
                marker
              );


            if (index !== -1) {

              const path =
                promotion.image_url.substring(
                  index + marker.length
                );


              await supabaseClient.storage
                .from("media")
                .remove([path]);

            }

          }

          catch (storageError) {

            console.warn(
              "Promotion deleted, but image cleanup failed:",
              storageError
            );

          }

        }


        await loadPromotions();

      }

      catch (error) {

        showError(
          "Unable to delete promotion: " +
          error.message
        );

      }

    }


    function closeModal() {

      modal.classList.remove("active");

      editingPromotion = null;

      form.reset();

      imagePreview.style.display =
        "none";

      imagePreview.src = "";

      setUploadStatus("");

      publishBtn.disabled = false;
      draftBtn.disabled = false;
      publishBtn.textContent = "PUBLISH";
      draftBtn.textContent = "SAVE DRAFT";

    }


    document
      .getElementById("addPromotionBtn")
      .addEventListener(
        "click",
        openAddModal
      );


    document
      .getElementById("closeModalBtn")
      .addEventListener(
        "click",
        closeModal
      );


    document
      .getElementById("cancelBtn")
      .addEventListener(
        "click",
        closeModal
      );


    modal.addEventListener(
      "click",
      function(event) {

        if (event.target === modal) {
          closeModal();
        }

      }
    );


    buttonActionTypeInput.addEventListener(
      "change",
      updateActionVisibility
    );

    termsActionTypeInput.addEventListener(
      "change",
      updateActionVisibility
    );

    updateActionVisibility();

    buttonContentInput.addEventListener("input", clearFieldErrors);
    buttonUrlInput.addEventListener("input", clearFieldErrors);
    termsContentInput.addEventListener("input", clearFieldErrors);
    termsUrlInput.addEventListener("input", clearFieldErrors);


    imageFileInput.addEventListener(
      "change",
      function() {

        const file =
          this.files[0];


        if (!file) return;


        const allowedTypes = [
          "image/jpeg",
          "image/png",
          "image/webp",
          "image/svg+xml"
        ];


        if (!allowedTypes.includes(file.type)) {

          setUploadStatus(
            "Only JPG, PNG, WEBP, and SVG images are allowed.",
            "error"
          );

          imagePreview.style.display =
            "none";

          this.value = "";

          return;

        }


        if (file.size > 10 * 1024 * 1024) {

          setUploadStatus(
            "Image must be smaller than 10 MB.",
            "error"
          );

          imagePreview.style.display =
            "none";

          this.value = "";

          return;

        }


        const reader =
          new FileReader();


        reader.onload =
          function(event) {

            imagePreview.src =
              event.target.result;

            imagePreview.style.display =
              "block";

            setUploadStatus(
              "Image ready to upload."
            );

          };


        reader.readAsDataURL(file);

      }
    );


    document.addEventListener(
      "keydown",
      function(event) {

        if (
          event.key === "Escape" &&
          modal.classList.contains("active")
        ) {
          closeModal();
        }

      }
    );


    document
      .getElementById("logoutBtn")
      .addEventListener(
        "click",
        async function() {

          await supabaseClient.auth.signOut();

          window.location.href =
            "login.html";

        }
      );


    /*
     * INITIALIZE
     */

    (async function init() {

      const authenticated =
        await checkAuth();


      if (!authenticated) return;


      await loadPromotions();

    })();

  </script>
