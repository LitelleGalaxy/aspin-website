<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ASPIN BO | Media</title>

  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="style.css">

  <style>
    .media-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 25px;
    }

    .media-upload {
      background: #101010;
      border: 1px solid #292929;
      padding: 20px;
      margin-bottom: 25px;
    }

    .media-upload h2 {
      margin-top: 0;
    }

    .media-upload p {
      color: #999;
      margin-bottom: 18px;
    }

    .media-upload input[type="file"] {
      width: 100%;
      box-sizing: border-box;
      padding: 14px;
      border: 1px dashed #5a4a26;
      background: #080808;
      color: #ccc;
    }

    .media-upload input[type="file"]:focus {
      outline: 1px solid #d4af37;
      outline-offset: 2px;
    }

    .upload-status {
      margin-top: 10px;
      color: #d4af37;
      font-size: 13px;
      min-height: 18px;
    }

    .upload-status.success {
      color: #79d18b;
    }

    .upload-status.error {
      color: #ff7777;
    }

    .upload-btn {
      margin-top: 15px;
    }

    .upload-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .media-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
    }

    .media-card {
      background: #101010;
      border: 1px solid #292929;
      overflow: hidden;
      transition: border-color 0.2s ease;
    }

    .media-card:hover {
      border-color: #4a3d22;
    }

    .media-preview {
      width: 100%;
      height: 180px;
      object-fit: cover;
      background: #050505;
      display: block;
    }

    .media-info {
      padding: 15px;
    }

    .media-name {
      font-size: 13px;
      word-break: break-all;
      color: #eee;
      margin-bottom: 10px;
    }

    .media-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .media-actions button,
    .media-actions a {
      border: 1px solid #3a3a3a;
      background: #171717;
      color: #eee;
      padding: 8px 11px;
      font-size: 11px;
      text-decoration: none;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .media-actions button:hover,
    .media-actions a:hover {
      border-color: #d4af37;
      color: #d4af37;
    }

    .media-actions .delete-btn {
      color: #ff7777;
      border-color: #632323;
    }

    .media-actions .delete-btn:hover {
      color: #ff9999;
      border-color: #9a3333;
      background: rgba(180, 30, 30, 0.12);
    }

    .empty-state {
      padding: 50px;
      text-align: center;
      border: 1px solid #292929;
      background: #101010;
      grid-column: 1 / -1;
    }

    .empty-state h2 {
      margin-bottom: 8px;
      color: #ddd;
    }

    .empty-state p {
      color: #777;
    }

    .loading-state {
      color: #d4af37;
      padding: 20px 0;
      grid-column: 1 / -1;
    }

    .error-state {
      color: #ff7777;
      background: rgba(150, 20, 20, 0.12);
      border: 1px solid #632323;
      padding: 15px;
      grid-column: 1 / -1;
    }

    @media (max-width: 1100px) {
      .media-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @media (max-width: 800px) {
      .media-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .media-toolbar {
        align-items: flex-start;
        flex-direction: column;
      }
    }

    @media (max-width: 520px) {
      .media-grid {
        grid-template-columns: 1fr;
      }

      .media-actions button,
      .media-actions a {
        flex: 1;
        text-align: center;
      }
    }
  </style>
</head>

<body>

<div class="admin-layout">

  <!-- SIDEBAR -->

  <aside class="sidebar">

    <div class="sidebar-brand">

      <img
        src="favicon.png"
        alt="ASPIN"
        class="sidebar-logo"
      >

      <div class="sidebar-brand-text">
        <strong>ASPIN.SITE</strong>
        <span>BACK OFFICE</span>
      </div>

    </div>


    <nav class="admin-nav">
        <a href="index.html">Dashboard</a>
        <a href="promotions.html">Promotions</a>
        <a href="media.html">Media</a>
        <a href="faqs.html">FAQs</a>
        <a href="payments.html">Payments</a>
        <a href="subscribers.html">Subscribers</a>
        <a href="analytics.html">Analytics</a>
        <a href="activity.html">Activity History</a>
        <a href="settings.html">Settings</a>
      </nav>

      <button id="logoutBtn" class="logout-btn">
        LOG OUT
      </button>

  </aside>


  <!-- MAIN -->

  <main class="admin-main">

    <header class="page-header">

      <div>

        <div class="eyebrow">
          ASPIN.SITE
        </div>

        <h1>Media</h1>

        <p>
          Upload and manage images used across the website.
        </p>

      </div>

    </header>


    <!-- UPLOAD -->

    <section class="media-upload">

      <h2>Upload Media</h2>

      <p>
        JPG, PNG, WEBP and SVG files are supported.
      </p>


      <input
        type="file"
        id="mediaFile"
        accept="image/jpeg,image/png,image/webp,image/svg+xml"
      >


      <button
        id="uploadBtn"
        class="primary-btn upload-btn"
        type="button"
      >
        UPLOAD IMAGE
      </button>


      <div
        id="uploadStatus"
        class="upload-status"
        aria-live="polite"
      ></div>

    </section>


    <!-- LIBRARY -->

    <section>

      <div class="media-toolbar">

        <div>

          <div class="eyebrow">
            LIBRARY
          </div>

          <h2>
            Uploaded Media
          </h2>

        </div>

      </div>


      <div
        id="mediaGrid"
        class="media-grid"
      ></div>

    </section>

  </main>

</div>


  <!-- SUPABASE -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
  <script src="mobile-menu.js"></script>

<script>

  const mediaFile =
    document.getElementById(
      "mediaFile"
    );

  const uploadBtn =
    document.getElementById(
      "uploadBtn"
    );

  const uploadStatus =
    document.getElementById(
      "uploadStatus"
    );

  const mediaGrid =
    document.getElementById(
      "mediaGrid"
    );


  function setUploadStatus(
    message,
    type = ""
  ) {

    uploadStatus.textContent =
      message;

    uploadStatus.className =
      "upload-status" +
      (
        type
          ? ` ${type}`
          : ""
      );

  }


  async function requireAdmin() {

    try {

      const {
        data: { session },
        error
      } =
        await supabaseClient.auth.getSession();


      if (error) {
        throw error;
      }


      if (!session) {

        window.location.replace(
          "login.html"
        );

        return false;

      }


      return true;

    }

    catch (error) {

      mediaGrid.innerHTML = `

        <div class="error-state">

          Unable to verify authentication:
          ${escapeHtml(error.message)}

        </div>

      `;

      return false;

    }

  }


  async function loadMedia() {

    const allowed =
      await requireAdmin();


    if (!allowed) return;


    mediaGrid.innerHTML = `

      <div class="loading-state">
        Loading media...
      </div>

    `;


    try {

      const {
        data,
        error
      } =
        await supabaseClient
          .storage
          .from("media")
          .list(
            "",
            {
              limit: 100,
              sortBy: {
                column: "created_at",
                order: "desc"
              }
            }
          );


      if (error) {
        throw error;
      }


      const files =
        (data || [])
          .filter(
            file =>
              file.name
          );


      if (!files.length) {

        mediaGrid.innerHTML = `

          <div class="empty-state">

            <h2>
              No media yet
            </h2>

            <p>
              Upload your first image above.
            </p>

          </div>

        `;

        return;

      }


      mediaGrid.innerHTML = "";


      files.forEach(file => {

        const path =
          file.name;


        const {
          data: publicData
        } =
          supabaseClient
            .storage
            .from("media")
            .getPublicUrl(
              path
            );


        const url =
          publicData.publicUrl;


        const card =
          document.createElement(
            "article"
          );


        card.className =
          "media-card";


        card.innerHTML = `

          <img
            src="${escapeHtml(url)}"
            class="media-preview"
            alt="${escapeHtml(file.name)}"
            loading="lazy"
          >


          <div class="media-info">

            <div class="media-name">
              ${escapeHtml(file.name)}
            </div>


            <div class="media-actions">

              <a
                href="${escapeHtml(url)}"
                target="_blank"
                rel="noopener noreferrer"
                class="view-btn"
              >
                VIEW
              </a>


              <button
                type="button"
                class="copy-btn"
              >
                COPY URL
              </button>


              <button
                type="button"
                class="delete-btn"
              >
                DELETE
              </button>

            </div>

          </div>

        `;


        const copyBtn =
          card.querySelector(
            ".copy-btn"
          );


        const deleteBtn =
          card.querySelector(
            ".delete-btn"
          );


        copyBtn.addEventListener(
          "click",
          () =>
            copyUrl(
              url,
              copyBtn
            )
        );


        deleteBtn.addEventListener(
          "click",
          () =>
            deleteMedia(
              path,
              deleteBtn
            )
        );


        mediaGrid.appendChild(
          card
        );

      });

    }

    catch (error) {

      mediaGrid.innerHTML = `

        <div class="error-state">

          Unable to load media:
          ${escapeHtml(error.message)}

        </div>

      `;

    }

  }


  async function uploadMedia() {

    const file =
      mediaFile.files[0];


    if (!file) {

      setUploadStatus(
        "Please choose an image first.",
        "error"
      );

      return;

    }


    const allowedTypes = [

      "image/jpeg",
      "image/png",
      "image/webp",
      "image/svg+xml"

    ];


    if (
      !allowedTypes.includes(
        file.type
      )
    ) {

      setUploadStatus(
        "Only JPG, PNG, WEBP and SVG files are allowed.",
        "error"
      );

      return;

    }


    if (
      file.size >
      10 * 1024 * 1024
    ) {

      setUploadStatus(
        "Image must be smaller than 10 MB.",
        "error"
      );

      return;

    }


    uploadBtn.disabled =
      true;


    setUploadStatus(
      "Uploading..."
    );


    try {

      const extension =
        file.name
          .split(".")
          .pop()
          .toLowerCase();


      /*
       * Timestamp + random string.
       * Works reliably during local development.
       */

      const randomPart =
        Math.random()
          .toString(36)
          .substring(
            2,
            12
          );


      const filename =
        `${Date.now()}-${randomPart}.${extension}`;


      const path =
        `media/${filename}`;


      const {
        error
      } =
        await supabaseClient
          .storage
          .from("media")
          .upload(
            path,
            file,
            {
              cacheControl:
                "3600",

              upsert:
                false
            }
          );


      if (error) {
        throw error;
      }


      setUploadStatus(
        "Image uploaded successfully.",
        "success"
      );


      mediaFile.value =
        "";


      await loadMedia();

    }

    catch (error) {

      setUploadStatus(
        "Upload failed: " +
        error.message,
        "error"
      );

    }

    finally {

      uploadBtn.disabled =
        false;

    }

  }


  async function deleteMedia(
    path,
    button
  ) {

    const confirmed =
      confirm(
        "Delete this image?\n\nThis cannot be undone."
      );


    if (!confirmed) return;


    button.disabled =
      true;


    button.textContent =
      "DELETING...";


    try {

      const {
        error
      } =
        await supabaseClient
          .storage
          .from("media")
          .remove([
            path
          ]);


      if (error) {
        throw error;
      }


      await loadMedia();

    }

    catch (error) {

      alert(
        "Unable to delete image: " +
        error.message
      );


      button.disabled =
        false;


      button.textContent =
        "DELETE";

    }

  }


  async function copyUrl(
    url,
    button
  ) {

    try {

      await navigator.clipboard
        .writeText(url);


      const originalText =
        button.textContent;


      button.textContent =
        "COPIED";


      setTimeout(() => {

        button.textContent =
          originalText;

      }, 1500);

    }

    catch {

      prompt(
        "Copy this image URL:",
        url
      );

    }

  }


  function escapeHtml(value) {

    return String(
      value ?? ""
    )
      .replace(
        /&/g,
        "&amp;"
      )
      .replace(
        /</g,
        "&lt;"
      )
      .replace(
        />/g,
        "&gt;"
      )
      .replace(
        /"/g,
        "&quot;"
      )
      .replace(
        /'/g,
        "&#039;"
      );

  }


  uploadBtn.addEventListener(
    "click",
    uploadMedia
  );


  document
    .getElementById(
      "logoutBtn"
    )
    .addEventListener(
      "click",
      async () => {

        await supabaseClient
          .auth
          .signOut();


        window.location.replace(
          "login.html"
        );

      }
    );


  loadMedia();

</script>

</body>
</html>
