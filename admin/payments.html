<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ASPIN BO | Payments</title>

  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="style.css">

  <style>
    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      gap: 20px;
    }

    .page-header h1 {
      margin: 0;
    }

    .page-header p {
      margin: 8px 0 0;
      color: #999;
    }

    .primary-btn {
      background: #b10d16;
      color: #fff;
      border: 1px solid #d4af37;
      padding: 13px 20px;
      cursor: pointer;
      font-weight: 700;
      letter-spacing: 1px;
      transition: 0.2s ease;
    }

    .primary-btn:hover {
      background: #d1111c;
    }

    .primary-btn:disabled,
    .secondary-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .payment-list {
      display: grid;
      gap: 15px;
    }

    .payment-card {
      background: #101010;
      border: 1px solid #292929;
      padding: 22px;
      transition: border-color 0.2s ease;
    }

    .payment-card:hover {
      border-color: #4a3d22;
    }

    .payment-name {
      font-size: 19px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .payment-description {
      color: #aaa;
      line-height: 1.6;
    }

    .payment-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 18px;
      padding-top: 15px;
      border-top: 1px solid #292929;
    }

    .payment-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .payment-actions button {
      padding: 9px 13px;
      border: 1px solid #333;
      background: #181818;
      color: #eee;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .payment-actions button:hover {
      border-color: #d4af37;
      color: #d4af37;
    }

    .payment-actions .delete-btn {
      color: #ff7777;
      border-color: #632323;
    }

    .payment-actions .delete-btn:hover {
      color: #ff9999;
      border-color: #9a3333;
      background: rgba(180, 30, 30, 0.12);
    }

    .payment-image {
      width: 100px;
      height: 70px;
      object-fit: contain;
      background: #070707;
      margin-top: 15px;
      border: 1px solid #292929;
    }

    .status {
      font-size: 11px;
      letter-spacing: .1em;
      padding: 6px 9px;
      border: 1px solid #444;
    }

    .published {
      color: #79d18b;
      border-color: #315d3a;
    }

    .draft {
      color: #aaa;
    }

    .empty-state {
      border: 1px dashed #3a3020;
      padding: 60px 20px;
      text-align: center;
      color: #777;
    }

    .empty-state h2 {
      color: #ddd;
      margin-bottom: 8px;
    }

    .loading {
      color: #d4af37;
      padding: 30px 0;
    }

    .error-message {
      display: none;
      color: #ff7777;
      background: rgba(150, 20, 20, 0.12);
      border: 1px solid #632323;
      padding: 15px;
      margin-bottom: 20px;
    }

    .success-message {
      display: none;
      color: #79d18b;
      background: rgba(50, 150, 90, 0.08);
      border: 1px solid #315d3a;
      padding: 15px;
      margin-bottom: 20px;
    }

    /* MODAL */

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .78);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 20px;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal {
      width: min(650px, 100%);
      max-height: 90vh;
      overflow-y: auto;
      background: #111;
      border: 1px solid #333;
      padding: 25px;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
    }

    .modal-header h2 {
      margin: 0;
    }

    .close-btn {
      border: 0;
      background: transparent;
      color: #aaa;
      font-size: 28px;
      cursor: pointer;
      line-height: 1;
    }

    .close-btn:hover {
      color: #fff;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-size: 11px;
      letter-spacing: .1em;
      margin-bottom: 7px;
      color: #aaa;
    }

    .form-group input,
    .form-group textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      background: #080808;
      border: 1px solid #333;
      color: #fff;
      outline: none;
      font-family: inherit;
    }

    .form-group input:focus,
    .form-group textarea:focus {
      border-color: #d4af37;
      box-shadow: 0 0 0 1px rgba(212, 175, 55, .12);
    }

    .form-group textarea {
      min-height: 120px;
      resize: vertical;
    }

    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 20px 0;
      color: #ddd;
      cursor: pointer;
    }

    .checkbox-row input {
      width: auto;
      cursor: pointer;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      padding-top: 20px;
      border-top: 1px solid #292929;
    }

    .secondary-btn {
      padding: 12px 16px;
      border: 1px solid #333;
      background: #181818;
      color: #eee;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .secondary-btn:hover {
      border-color: #d4af37;
      color: #d4af37;
    }

    @media (max-width: 650px) {

      .page-header {
        align-items: flex-start;
        flex-direction: column;
      }

      .payment-meta {
        align-items: flex-start;
        flex-direction: column;
        gap: 15px;
      }

      .payment-actions {
        width: 100%;
      }

      .payment-actions button {
        flex: 1;
      }

      .modal-actions {
        flex-direction: column-reverse;
      }

      .modal-actions button {
        width: 100%;
      }
    }
  </style>
</head>

<body>

<div class="admin-layout">

  <!-- SIDEBAR -->

  <aside class="sidebar">

    <div class="sidebar-brand">

      <img
        src="favicon.png"
        alt="ASPIN"
        class="sidebar-logo"
      >

      <div class="sidebar-brand-text">
        <strong>ASPIN.SITE</strong>
        <span>BACK OFFICE</span>
      </div>

    </div>


    <nav class="admin-nav">
        <a href="index.html">Dashboard</a>
        <a href="promotions.html">Promotions</a>
        <a href="media.html">Media</a>
        <a href="faqs.html">FAQs</a>
        <a href="payments.html">Payments</a>
        <a href="subscribers.html">Subscribers</a>
        <a href="analytics.html">Analytics</a>
        <a href="activity.html">Activity History</a>
        <a href="settings.html">Settings</a>
      </nav>

      <button id="logoutBtn" class="logout-btn">
        LOG OUT
      </button>

  </aside>


  <!-- MAIN -->

  <main class="admin-main">

    <header class="page-header">

      <div>

        <div class="eyebrow">
          ASPIN.SITE
        </div>

        <h1>Payments</h1>

        <p>
          Manage payment methods displayed on the website.
        </p>

      </div>


      <button
        id="addPaymentBtn"
        class="primary-btn"
        type="button"
      >
        + ADD PAYMENT
      </button>

    </header>


    <div
      id="errorMessage"
      class="error-message"
    ></div>


    <div
      id="successMessage"
      class="success-message"
    ></div>


    <div
      id="loading"
      class="loading"
    >
      Loading payment methods...
    </div>


    <section
      id="paymentList"
      class="payment-list"
    ></section>

  </main>

</div>


<!-- PAYMENT MODAL -->

<div
  id="paymentModal"
  class="modal-overlay"
  role="dialog"
  aria-modal="true"
  aria-labelledby="modalTitle"
>

  <div class="modal">

    <div class="modal-header">

      <h2 id="modalTitle">
        Add Payment Method
      </h2>

      <button
        id="closeModal"
        class="close-btn"
        type="button"
        aria-label="Close"
      >
        ×
      </button>

    </div>


    <form id="paymentForm">

      <input
        type="hidden"
        id="paymentId"
      >


      <div class="form-group">

        <label for="name">
          PAYMENT NAME
        </label>

        <input
          id="name"
          type="text"
          required
          maxlength="100"
          placeholder="GCash"
        >

      </div>


      <div class="form-group">

        <label for="description">
          DESCRIPTION
        </label>

        <textarea
          id="description"
          maxlength="500"
          placeholder="Enter payment method information..."
        ></textarea>

      </div>


      <div class="form-group">

        <label for="imageUrl">
          IMAGE URL
        </label>

        <input
          id="imageUrl"
          type="url"
          placeholder="https://..."
        >

      </div>


      <div class="form-group">

        <label for="sortOrder">
          SORT ORDER
        </label>

        <input
          id="sortOrder"
          type="number"
          value="0"
          min="0"
          step="1"
        >

      </div>


      <label class="checkbox-row">

        <input
          id="isPublished"
          type="checkbox"
          checked
        >

        <span>
          Publish this payment method
        </span>

      </label>


      <div class="modal-actions">

        <button
          type="button"
          id="cancelBtn"
          class="secondary-btn"
        >
          CANCEL
        </button>

        <button
          type="submit"
          id="savePaymentBtn"
          class="primary-btn"
        >
          SAVE PAYMENT
        </button>

      </div>

    </form>

  </div>

</div>


  <!-- SUPABASE -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
  <script src="mobile-menu.js"></script>

<script>

  let payments = [];


  const paymentModal =
    document.getElementById("paymentModal");

  const paymentForm =
    document.getElementById("paymentForm");

  const paymentList =
    document.getElementById("paymentList");

  const loading =
    document.getElementById("loading");

  const errorMessage =
    document.getElementById("errorMessage");

  const successMessage =
    document.getElementById("successMessage");

  const savePaymentBtn =
    document.getElementById("savePaymentBtn");


  function showError(message) {

    errorMessage.textContent = message;

    errorMessage.style.display =
      "block";

  }


  function hideError() {

    errorMessage.textContent = "";

    errorMessage.style.display =
      "none";

  }


  function showSuccess(message) {

    successMessage.textContent =
      message;

    successMessage.style.display =
      "block";

    setTimeout(() => {

      successMessage.style.display =
        "none";

    }, 2500);

  }


  async function requireAdmin() {

    try {

      const {
        data: { session },
        error
      } =
        await supabaseClient.auth.getSession();


      if (error) {
        throw error;
      }


      if (!session) {

        window.location.replace(
          "login.html"
        );

        return false;

      }


      return true;

    } catch (error) {

      showError(
        "Unable to verify authentication: " +
        error.message
      );

      return false;

    }

  }


  async function loadPayments() {

    const authenticated =
      await requireAdmin();


    if (!authenticated) return;


    hideError();


    loading.style.display =
      "block";


    paymentList.innerHTML =
      "";


    try {

      const {
        data,
        error
      } =
        await supabaseClient
          .from("payment_methods")
          .select("*")
          .order("sort_order", {
            ascending: true
          })
          .order("created_at", {
            ascending: false
          });


      if (error) {
        throw error;
      }


      payments =
        data || [];


      renderPayments();

    }

    catch (error) {

      showError(
        "Unable to load payments: " +
        error.message
      );

    }

    finally {

      loading.style.display =
        "none";

    }

  }


  function renderPayments() {

    paymentList.innerHTML =
      "";


    if (!payments.length) {

      paymentList.innerHTML = `

        <div class="empty-state">

          <h2>
            No payment methods yet
          </h2>

          <p>
            Add your first payment method.
          </p>

        </div>

      `;

      return;

    }


    payments.forEach(payment => {

      const card =
        document.createElement(
          "article"
        );


      card.className =
        "payment-card";


      const image =
        payment.image_url
          ? `

            <img
              src="${escapeHtml(
                payment.image_url
              )}"
              class="payment-image"
              alt="${escapeHtml(
                payment.name
              )}"
              loading="lazy"
            >

          `
          : "";


      const statusClass =
        payment.is_published
          ? "published"
          : "draft";


      const statusText =
        payment.is_published
          ? "PUBLISHED"
          : "DRAFT";


      card.innerHTML = `

        <div class="payment-name">
          ${escapeHtml(
            payment.name
          )}
        </div>


        <div class="payment-description">

          ${escapeHtml(
            payment.description ||
            "No description."
          )}

        </div>


        ${image}


        <div class="payment-meta">

          <span
            class="status ${statusClass}"
          >
            ${statusText}
          </span>


          <div class="payment-actions">

            <button
              class="edit-btn"
              type="button"
            >
              EDIT
            </button>


            <button
              class="toggle-btn"
              type="button"
            >
              ${
                payment.is_published
                  ? "UNPUBLISH"
                  : "PUBLISH"
              }
            </button>


            <button
              class="delete-btn"
              type="button"
            >
              DELETE
            </button>

          </div>

        </div>

      `;


      card
        .querySelector(".edit-btn")
        .addEventListener(
          "click",
          () => openModal(payment)
        );


      card
        .querySelector(".toggle-btn")
        .addEventListener(
          "click",
          () =>
            togglePayment(
              payment.id,
              !payment.is_published
            )
        );


      card
        .querySelector(".delete-btn")
        .addEventListener(
          "click",
          () =>
            deletePayment(
              payment.id
            )
        );


      paymentList.appendChild(
        card
      );

    });

  }


  function openModal(payment = null) {

    hideError();


    document.getElementById(
      "modalTitle"
    ).textContent =
      payment
        ? "Edit Payment Method"
        : "Add Payment Method";


    document.getElementById(
      "paymentId"
    ).value =
      payment?.id || "";


    document.getElementById(
      "name"
    ).value =
      payment?.name || "";


    document.getElementById(
      "description"
    ).value =
      payment?.description || "";


    document.getElementById(
      "imageUrl"
    ).value =
      payment?.image_url || "";


    document.getElementById(
      "sortOrder"
    ).value =
      payment?.sort_order ?? 0;


    document.getElementById(
      "isPublished"
    ).checked =
      payment
        ? payment.is_published === true
        : true;


    savePaymentBtn.disabled =
      false;


    savePaymentBtn.textContent =
      "SAVE PAYMENT";


    paymentModal.classList.add(
      "active"
    );


    setTimeout(() => {

      document.getElementById(
        "name"
      ).focus();

    }, 50);

  }


  function closeModal() {

    paymentModal.classList.remove(
      "active"
    );


    paymentForm.reset();


    document.getElementById(
      "paymentId"
    ).value = "";


    document.getElementById(
      "sortOrder"
    ).value = "0";


    document.getElementById(
      "isPublished"
    ).checked = true;


    savePaymentBtn.disabled =
      false;


    savePaymentBtn.textContent =
      "SAVE PAYMENT";

  }


  async function togglePayment(
    id,
    publish
  ) {

    hideError();


    try {

      const {
        error
      } =
        await supabaseClient
          .from("payment_methods")
          .update({
            is_published:
              publish,

            updated_at:
              new Date().toISOString()
          })
          .eq("id", id);


      if (error) {
        throw error;
      }


      showSuccess(
        publish
          ? "Payment method published."
          : "Payment method unpublished."
      );


      await loadPayments();

    }

    catch (error) {

      showError(
        "Unable to update payment: " +
        error.message
      );

    }

  }


  async function deletePayment(id) {

    const payment =
      payments.find(
        item =>
          String(item.id) ===
          String(id)
      );


    if (!payment) return;


    const confirmed =
      confirm(
        `Delete "${payment.name}"?\n\nThis cannot be undone.`
      );


    if (!confirmed) return;


    hideError();


    try {

      const {
        error
      } =
        await supabaseClient
          .from("payment_methods")
          .delete()
          .eq("id", id);


      if (error) {
        throw error;
      }


      showSuccess(
        "Payment method deleted."
      );


      await loadPayments();

    }

    catch (error) {

      showError(
        "Unable to delete payment: " +
        error.message
      );

    }

  }


  paymentForm.addEventListener(
    "submit",
    async event => {

      event.preventDefault();


      hideError();


      const id =
        document.getElementById(
          "paymentId"
        ).value;


      const name =
        document.getElementById(
          "name"
        ).value.trim();


      const description =
        document.getElementById(
          "description"
        ).value.trim();


      const imageUrl =
        document.getElementById(
          "imageUrl"
        ).value.trim();


      const sortOrder =
        Math.max(
          0,
          Number(
            document.getElementById(
              "sortOrder"
            ).value
          ) || 0
        );


      const isPublished =
        document.getElementById(
          "isPublished"
        ).checked;


      if (!name) {

        showError(
          "Payment name is required."
        );

        return;

      }


      if (imageUrl) {

        try {

          new URL(imageUrl);

        }

        catch {

          showError(
            "Please enter a valid image URL."
          );

          return;

        }

      }


      savePaymentBtn.disabled =
        true;


      savePaymentBtn.textContent =
        "SAVING...";


      const paymentData = {

        name,

        description:
          description || null,

        image_url:
          imageUrl || null,

        sort_order:
          sortOrder,

        is_published:
          isPublished,

        updated_at:
          new Date().toISOString()

      };


      try {

        let result;


        if (id) {

          result =
            await supabaseClient
              .from("payment_methods")
              .update(
                paymentData
              )
              .eq("id", id);

        }

        else {

          result =
            await supabaseClient
              .from("payment_methods")
              .insert(
                paymentData
              );

        }


        if (result.error) {
          throw result.error;
        }


        closeModal();


        showSuccess(
          id
            ? "Payment method updated."
            : "Payment method added."
        );


        await loadPayments();

      }

      catch (error) {

        showError(
          "Unable to save payment method: " +
          error.message
        );


        savePaymentBtn.disabled =
          false;


        savePaymentBtn.textContent =
          "SAVE PAYMENT";

      }

    }
  );


  document
    .getElementById(
      "addPaymentBtn"
    )
    .addEventListener(
      "click",
      () => openModal()
    );


  document
    .getElementById(
      "closeModal"
    )
    .addEventListener(
      "click",
      closeModal
    );


  document
    .getElementById(
      "cancelBtn"
    )
    .addEventListener(
      "click",
      closeModal
    );


  paymentModal.addEventListener(
    "click",
    event => {

      if (
        event.target ===
        paymentModal
      ) {

        closeModal();

      }

    }
  );


  document.addEventListener(
    "keydown",
    event => {

      if (
        event.key === "Escape" &&
        paymentModal.classList.contains(
          "active"
        )
      ) {

        closeModal();

      }

    }
  );


  document
    .getElementById(
      "logoutBtn"
    )
    .addEventListener(
      "click",
      async () => {

        await supabaseClient.auth.signOut();

        window.location.replace(
          "login.html"
        );

      }
    );


  function escapeHtml(value) {

    return String(value ?? "")
      .replace(
        /&/g,
        "&amp;"
      )
      .replace(
        /</g,
        "&lt;"
      )
      .replace(
        />/g,
        "&gt;"
      )
      .replace(
        /"/g,
        "&quot;"
      )
      .replace(
        /'/g,
        "&#039;"
      );

  }


  /* INITIALIZE */

  loadPayments();

</script>

</body>
</html>
