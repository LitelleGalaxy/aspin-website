<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ASPIN BO | Subscribers</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="style.css">

    <style>
        .subscriber-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .search-box {
            padding: 11px 13px;
            background: #080808;
            border: 1px solid #333;
            color: #fff;
            min-width: 260px;
            outline: none;
        }

        .search-box:focus {
            border-color: #d4af37;
        }

        .table-wrap {
            overflow-x: auto;
            background: #101010;
            border: 1px solid #292929;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 700px;
        }

        th,
        td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #292929;
        }

        th {
            font-size: 11px;
            letter-spacing: .1em;
            color: #aaa;
            text-transform: uppercase;
            white-space: nowrap;
        }

        td {
            font-size: 13px;
            color: #eee;
        }

        tbody tr:hover {
            background: rgba(255, 255, 255, .02);
        }

        .status {
            display: inline-block;
            font-size: 10px;
            padding: 5px 8px;
            border: 1px solid #444;
            letter-spacing: .05em;
        }

        .active-status {
            color: #79d18b;
            border-color: #315d3a;
        }

        .inactive-status {
            color: #aaa;
            border-color: #444;
        }

        .consent-yes {
            color: #79d18b;
        }

        .consent-no {
            color: #aaa;
        }

        .action-btn {
            padding: 7px 10px;
            border: 1px solid #333;
            background: #181818;
            color: #eee;
            cursor: pointer;
            transition:
                border-color .2s ease,
                color .2s ease,
                background .2s ease;
        }

        .action-btn:hover {
            border-color: #d4af37;
            color: #d4af37;
            background: #202020;
        }

        .action-btn:disabled {
            opacity: .6;
            cursor: wait;
        }

        .loading-cell,
        .empty-cell,
        .error-cell {
            text-align: center;
            padding: 35px 20px;
            color: #999;
        }

        .error-cell {
            color: #d97b7b;
        }

        @media (max-width: 700px) {

            .subscriber-toolbar {
                align-items: flex-start;
                flex-direction: column;
            }

            .search-box {
                width: 100%;
                min-width: 0;
                box-sizing: border-box;
            }

            .table-wrap {
                width: 100%;
            }
        }
    </style>
</head>


<body>

<div class="admin-layout">

    <!-- =========================
         SIDEBAR
    ========================= -->

    <aside class="sidebar">

        <div class="sidebar-brand">

            <img
                src="favicon.png"
                alt="ASPIN"
                class="sidebar-logo"
            >

            <div class="sidebar-brand-text">

                <strong>
                    ASPIN.SITE
                </strong>

                <span>
                    BACK OFFICE
                </span>

            </div>

        </div>


    <nav class="admin-nav">
        <a href="index.html">Dashboard</a>
        <a href="promotions.html">Promotions</a>
        <a href="media.html">Media</a>
        <a href="faqs.html">FAQs</a>
        <a href="payments.html">Payments</a>
        <a href="subscribers.html">Subscribers</a>
        <a href="analytics.html">Analytics</a>
        <a href="activity.html">Activity History</a>
        <a href="settings.html">Settings</a>
      </nav>

      <button id="logoutBtn" class="logout-btn">
        LOG OUT
      </button>

    </aside>


    <!-- =========================
         MAIN CONTENT
    ========================= -->

    <main class="admin-main">

        <header class="page-header">

            <div>

                <div class="eyebrow">
                    ASPIN.SITE
                </div>

                <h1>
                    Subscribers
                </h1>

                <p>
                    Manage newsletter and promotional update subscribers.
                </p>

            </div>

        </header>


        <!-- =========================
             TOOLBAR
        ========================= -->

        <div class="subscriber-toolbar">

            <div>

                <strong id="subscriberCount">
                    0 subscribers
                </strong>

            </div>


            <input
                id="searchInput"
                class="search-box"
                type="search"
                placeholder="Search email or phone..."
                autocomplete="off"
            >

        </div>


        <!-- =========================
             SUBSCRIBER TABLE
        ========================= -->

        <div class="table-wrap">

            <table>

                <thead>

                    <tr>

                        <th>
                            Email
                        </th>

                        <th>
                            Phone
                        </th>

                        <th>
                            Consent
                        </th>

                        <th>
                            Status
                        </th>

                        <th>
                            Date
                        </th>

                        <th>
                            Action
                        </th>

                    </tr>

                </thead>


                <tbody id="subscriberTable">

                </tbody>

            </table>

        </div>

    </main>

</div>


  <!-- SUPABASE -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
  <script src="mobile-menu.js"></script>

<script>

let subscribers = [];


/* =========================
   ADMIN AUTH
========================= */

async function requireAdmin() {

    const {
        data: { session },
        error
    } = await supabaseClient.auth.getSession();


    if (error) {

        console.error(
            "Session error:",
            error
        );

        window.location.replace(
            "login.html"
        );

        return false;
    }


    if (!session) {

        window.location.replace(
            "login.html"
        );

        return false;
    }


    return true;
}


/* =========================
   LOAD SUBSCRIBERS
========================= */

async function loadSubscribers() {

    const isAdmin =
        await requireAdmin();

    if (!isAdmin) {
        return;
    }


    const tbody =
        document.getElementById(
            "subscriberTable"
        );


    tbody.innerHTML = `
        <tr>
            <td
                colspan="6"
                class="loading-cell"
            >
                Loading subscribers...
            </td>
        </tr>
    `;


    const {
        data,
        error
    } = await supabaseClient

        .from("subscribers")

        .select("*")

        .order(
            "created_at",
            {
                ascending: false
            }
        );


    if (error) {

        console.error(
            "Unable to load subscribers:",
            error
        );


        tbody.innerHTML = `
            <tr>
                <td
                    colspan="6"
                    class="error-cell"
                >
                    Unable to load subscribers:
                    ${escapeHtml(error.message)}
                </td>
            </tr>
        `;

        return;
    }


    subscribers =
        data || [];


    renderSubscribers();
}


/* =========================
   RENDER SUBSCRIBERS
========================= */

function renderSubscribers() {

    const tbody =
        document.getElementById(
            "subscriberTable"
        );


    const search =
        document
            .getElementById(
                "searchInput"
            )
            .value
            .trim()
            .toLowerCase();


    const filtered =
        subscribers.filter(
            subscriber => {

                const email =
                    String(
                        subscriber.email || ""
                    ).toLowerCase();


                const phone =
                    String(
                        subscriber.phone || ""
                    ).toLowerCase();


                return (
                    email.includes(search) ||
                    phone.includes(search)
                );

            }
        );


    document.getElementById(
        "subscriberCount"
    ).textContent =
        `${subscribers.length} subscriber${
            subscribers.length === 1
                ? ""
                : "s"
        }`;


    tbody.innerHTML = "";


    if (!filtered.length) {

        tbody.innerHTML = `
            <tr>
                <td
                    colspan="6"
                    class="empty-cell"
                >
                    ${
                        search
                            ? "No subscribers match your search."
                            : "No subscribers found."
                    }
                </td>
            </tr>
        `;

        return;
    }


    filtered.forEach(
        subscriber => {

            const tr =
                document.createElement(
                    "tr"
                );


            const date =
                subscriber.created_at
                    ? new Date(
                        subscriber.created_at
                    ).toLocaleDateString(
                        undefined,
                        {
                            year: "numeric",
                            month: "short",
                            day: "numeric"
                        }
                    )
                    : "—";


            const consentClass =
                subscriber.consent
                    ? "consent-yes"
                    : "consent-no";


            const statusClass =
                subscriber.is_active
                    ? "active-status"
                    : "inactive-status";


            const statusText =
                subscriber.is_active
                    ? "ACTIVE"
                    : "INACTIVE";


            const actionText =
                subscriber.is_active
                    ? "DEACTIVATE"
                    : "ACTIVATE";


            tr.innerHTML = `

                <td>
                    ${escapeHtml(
                        subscriber.email || "—"
                    )}
                </td>


                <td>
                    ${escapeHtml(
                        subscriber.phone || "—"
                    )}
                </td>


                <td>

                    <span class="${consentClass}">
                        ${
                            subscriber.consent
                                ? "YES"
                                : "NO"
                        }
                    </span>

                </td>


                <td>

                    <span
                        class="status ${statusClass}"
                    >
                        ${statusText}
                    </span>

                </td>


                <td>
                    ${escapeHtml(date)}
                </td>


                <td>

                    <button
                        type="button"
                        class="action-btn"
                        data-id="${escapeHtml(
                            subscriber.id
                        )}"
                        data-active="${
                            !subscriber.is_active
                        }"
                    >
                        ${actionText}
                    </button>

                </td>

            `;


            const button =
                tr.querySelector(
                    ".action-btn"
                );


            button.addEventListener(
                "click",
                () => {

                    toggleSubscriber(
                        subscriber.id,
                        !subscriber.is_active,
                        button
                    );

                }
            );


            tbody.appendChild(tr);

        }
    );
}


/* =========================
   TOGGLE SUBSCRIBER
========================= */

async function toggleSubscriber(
    id,
    active,
    button
) {

    if (button) {

        button.disabled = true;

        button.textContent =
            "SAVING...";
    }


    const {
        error
    } = await supabaseClient

        .from("subscribers")

        .update({
            is_active: active
        })

        .eq(
            "id",
            id
        );


    if (error) {

        console.error(
            "Unable to update subscriber:",
            error
        );


        alert(
            "Unable to update subscriber: " +
            error.message
        );


        if (button) {

            button.disabled = false;

            button.textContent =
                active
                    ? "ACTIVATE"
                    : "DEACTIVATE";
        }


        return;
    }


    await loadSubscribers();
}


/* =========================
   SEARCH
========================= */

document
    .getElementById(
        "searchInput"
    )
    .addEventListener(
        "input",
        renderSubscribers
    );


/* =========================
   LOGOUT
========================= */

document
    .getElementById(
        "logoutBtn"
    )
    .addEventListener(
        "click",
        async () => {

            await supabaseClient.auth.signOut();

            window.location.replace(
                "login.html"
            );

        }
    );


/* =========================
   HTML ESCAPE
========================= */

function escapeHtml(value) {

    return String(
        value ?? ""
    )

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );
}


/* =========================
   START
========================= */

loadSubscribers();

</script>

</body>
</html>
