<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ASPIN BO | FAQs</title>

  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="style.css">

  <style>

    /* =========================
       FAQ LIST
    ========================= */

    .faq-list {
      display: grid;
      gap: 15px;
    }

    .faq-card {
      background: #101010;
      border: 1px solid #292929;
      padding: 16px 22px;
    }

    .faq-category {
      color: #d4af37;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .faq-question {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .faq-answer {
      margin-top: 35px;
      margin-left: 35px;
      min-height: 40px;
    }

    .faq-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-top: 18px;
      padding-top: 12px;
      border-top: 1px solid #292929;
    }

    .faq-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      position: relative;
      z-index: 10;
    }

    .faq-actions button {
      padding: 9px 13px;
      border: 1px solid #333;
      background: #181818;
      color: #eee;
      cursor: pointer;
      position: relative;
      z-index: 11;
      pointer-events: auto;
    }

    .faq-actions button:hover {
      border-color: #d4af37;
      color: #d4af37;
    }

    .status {
      font-size: 11px;
      letter-spacing: .1em;
      padding: 6px 9px;
      border: 1px solid #444;
    }

    .published {
      color: #79d18b;
      border-color: #315d3a;
    }

    .draft {
      color: #d4af37;
      border-color: #6b5815;
    }


    /* =========================
       MODAL
    ========================= */

    .modal-overlay {
      position: fixed;
      inset: 0;

      background: rgba(0, 0, 0, .78);

      display: none;
      align-items: center;
      justify-content: center;

      z-index: 1000;
      padding: 20px;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal {
      width: min(650px, 100%);
      max-height: 90vh;

      overflow-y: auto;

      background: #111;
      border: 1px solid #333;

      padding: 25px;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;

      margin-bottom: 25px;
    }

    .close-btn {
      border: 0;
      background: transparent;

      color: #aaa;
      font-size: 28px;

      cursor: pointer;
    }

    .close-btn:hover {
      color: #d4af37;
    }


    /* =========================
       FORM
    ========================= */

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;

      font-size: 11px;
      letter-spacing: .1em;

      margin-bottom: 7px;

      color: #aaa;
    }

    .form-group input,
    .form-group textarea {
      width: 100%;
      box-sizing: border-box;

      padding: 12px;

      background: #080808;

      border: 1px solid #333;

      color: #fff;

      font-family: inherit;
      font-size: 14px;
    }

    .form-group input:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: #d4af37;
    }

    .form-group textarea {
      min-height: 150px;
      resize: vertical;
    }


    /* =========================
       PUBLISH BUTTONS
    ========================= */

    .faq-publish-actions {
      display: grid;

      grid-template-columns:
        1fr
        1fr
        auto;

      gap: 10px;

      margin-top: 25px;

      padding-top: 20px;

      border-top: 1px solid #292929;
    }

    .faq-publish-actions button {
      min-height: 48px;

      padding: 12px 18px;

      cursor: pointer;

      font-weight: 800;

      letter-spacing: 1px;

      font-family: inherit;
    }

    .publish-btn {
      background: #b90000;

      color: #fff;

      border: 1px solid #d4af37;
    }

    .publish-btn:hover {
      background: #d00000;
    }

    .draft-btn {
      background: transparent;

      color: #d4af37;

      border: 1px solid #d4af37;
    }

    .draft-btn:hover {
      background: rgba(212, 175, 55, .08);
    }

    .cancel-btn {
      background: transparent;

      color: #aaa;

      border: 1px solid #555;
    }

    .cancel-btn:hover {
      color: #fff;

      border-color: #888;
    }

    .faq-publish-actions button:disabled {
      opacity: .5;

      cursor: not-allowed;
    }


    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 650px) {

      .faq-meta {
        align-items: flex-start;

        flex-direction: column;
      }

      .faq-actions {
        width: 100%;
      }

      .faq-actions button {
        flex: 1;
      }

      .faq-publish-actions {
        grid-template-columns: 1fr;
      }

      .faq-answer {
        margin-left: 0;
      }

    }

  </style>

</head>


<body>


<div class="admin-layout">


  <!-- =========================
       SIDEBAR
  ========================= -->

  <aside class="sidebar">

    <div class="sidebar-brand">

      <img
        src="favicon.png"
        alt="ASPIN"
        class="sidebar-logo"
      >

      <div class="sidebar-brand-text">

        <strong>ASPIN.SITE</strong>

        <span>BACK OFFICE</span>

      </div>

    </div>


    <nav class="admin-nav">

      <a href="index.html">
        Dashboard
      </a>

      <a href="promotions.html">
        Promotions
      </a>

      <a href="media.html">
        Media
      </a>

      <a href="faqs.html">
        FAQs
      </a>

      <a href="payments.html">
        Payments
      </a>

      <a href="subscribers.html">
        Subscribers
      </a>

      <a href="analytics.html">
        Analytics
      </a>

      <a href="activity.html">
        Activity History
      </a>

      <a href="settings.html">
        Settings
      </a>

    </nav>


    <button
      id="logoutBtn"
      class="logout-btn"
      type="button"
    >
      LOG OUT
    </button>

  </aside>



  <!-- =========================
       MAIN
  ========================= -->

  <main class="admin-main">


    <header class="page-header">

      <div>

        <div class="eyebrow">
          ASPIN.SITE
        </div>

        <h1>
          FAQs
        </h1>

        <p>
          Manage frequently asked questions shown on the website.
        </p>

      </div>


      <button
        id="addFaqBtn"
        class="primary-btn"
        type="button"
      >
        + ADD FAQ
      </button>

    </header>


    <div id="errorMessage"></div>


    <section
      id="faqList"
      class="faq-list"
    ></section>


  </main>

</div>



<!-- =========================
     FAQ MODAL
========================= -->

<div
  id="faqModal"
  class="modal-overlay"
>

  <div class="modal">


    <div class="modal-header">

      <h2 id="modalTitle">
        Add FAQ
      </h2>

      <button
        id="closeModal"
        class="close-btn"
        type="button"
      >
        ×
      </button>

    </div>



    <form id="faqForm">


      <input
        type="hidden"
        id="faqId"
      >


      <!-- CATEGORY -->

      <div class="form-group">

        <label for="category">
          QUESTION CATEGORY
        </label>

        <input
          id="category"
          type="text"
          required
          placeholder="General"
          maxlength="100"
        >

      </div>



      <!-- QUESTION -->

      <div class="form-group">

        <label for="question">
          QUESTION
        </label>

        <input
          id="question"
          type="text"
          required
          placeholder="How do I register?"
        >

      </div>



      <!-- ANSWER -->

      <div class="form-group">

        <label for="answer">
          ANSWER
        </label>

        <textarea
          id="answer"
          required
          placeholder="Enter the answer..."
        ></textarea>

      </div>



      <!-- SORT ORDER -->

      <div class="form-group">

        <label for="sortOrder">
          SORT ORDER
        </label>

        <input
          id="sortOrder"
          type="number"
          value="0"
        >

      </div>



      <!-- PUBLISH / DRAFT / CANCEL -->

      <div class="faq-publish-actions">


        <button
          type="submit"
          id="publishBtn"
          class="publish-btn"
          data-publish-state="true"
        >
          PUBLISH
        </button>


        <button
          type="submit"
          id="draftBtn"
          class="draft-btn"
          data-publish-state="false"
        >
          SAVE DRAFT
        </button>


        <button
          type="button"
          id="cancelBtn"
          class="cancel-btn"
        >
          CANCEL
        </button>


      </div>


    </form>

  </div>

</div>



<!-- =========================
     SUPABASE
========================= -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>

<script src="mobile-menu.js"></script>



<script>


/* =========================================
   VARIABLES
========================================= */

let faqs = [];

let publishState = false;



/* =========================================
   AUTH CHECK
========================================= */

async function requireAdmin() {

  const {
    data: { session }
  } = await supabaseClient.auth.getSession();


  if (!session) {

    window.location.replace(
      "login.html"
    );

    return false;

  }


  return true;

}



/* =========================================
   LOAD FAQS
========================================= */

async function loadFaqs() {

  if (!(await requireAdmin())) {
    return;
  }


  const list =
    document.getElementById(
      "faqList"
    );


  list.innerHTML =
    "<p>Loading FAQs...</p>";


  const {
    data,
    error
  } = await supabaseClient

    .from("faqs")

    .select("*")

    .order("sort_order", {
      ascending: true
    })

    .order("created_at", {
      ascending: false
    });


  if (error) {

    console.error(
      "FAQ loading error:",
      error
    );


    list.innerHTML = `
      <p>
        Unable to load FAQs:
        ${escapeHtml(error.message)}
      </p>
    `;

    return;

  }


  faqs =
    data || [];


  renderFaqs();

}



/* =========================================
   RENDER FAQS
========================================= */

function renderFaqs() {

  const list =
    document.getElementById(
      "faqList"
    );


  list.innerHTML = "";


  if (!faqs.length) {

    list.innerHTML = `

      <div class="empty-state">

        <h2>
          No FAQs yet
        </h2>

        <p>
          Add your first FAQ.
        </p>

      </div>

    `;

    return;

  }


  faqs.forEach(
    faq => {


      const card =
        document.createElement(
          "article"
        );


      card.className =
        "faq-card";


      card.innerHTML = `

        <div class="faq-category">

          ${escapeHtml(
            faq.category ||
            "General"
          )}

        </div>


        <div class="faq-question">

          ${escapeHtml(
            faq.question
          )}

        </div>


        <div class="faq-answer">

          ${escapeHtml(
            faq.answer
          )}

        </div>


        <div class="faq-meta">


          <span class="status ${
            faq.is_published
              ? "published"
              : "draft"
          }">

            ${
              faq.is_published
                ? "PUBLISHED"
                : "DRAFT"
            }

          </span>


          <div class="faq-actions">


            <button
              type="button"
              class="faq-edit-btn"
              data-id="${faq.id}"
            >
              EDIT
            </button>


            <button
              type="button"
              class="faq-publish-btn"
              data-id="${faq.id}"
              data-publish="${
                !faq.is_published
              }"
            >

              ${
                faq.is_published
                  ? "UNPUBLISH"
                  : "PUBLISH"
              }

            </button>


            <button
              type="button"
              class="faq-delete-btn"
              data-id="${faq.id}"
            >
              DELETE
            </button>


          </div>


        </div>

      `;


      list.appendChild(
        card
      );


    }
  );

}



/* =========================================
   FAQ BUTTON HANDLER
========================================= */

document
  .getElementById("faqList")
  .addEventListener(
    "click",
    async function(event) {


      const button =
        event.target.closest(
          "button"
        );


      if (!button) {
        return;
      }


      const id =
        button.dataset.id;


      if (!id) {
        return;
      }



      /* EDIT */

      if (
        button.classList.contains(
          "faq-edit-btn"
        )
      ) {

        editFaq(id);

        return;

      }



      /* PUBLISH */

      if (
        button.classList.contains(
          "faq-publish-btn"
        )
      ) {

        const publish =
          button.dataset.publish ===
          "true";


        await toggleFaq(
          id,
          publish
        );

        return;

      }



      /* DELETE */

      if (
        button.classList.contains(
          "faq-delete-btn"
        )
      ) {

        await deleteFaq(
          id
        );

        return;

      }


    }
  );



/* =========================================
   OPEN MODAL
========================================= */

function openModal(
  faq = null
) {


  const modal =
    document.getElementById(
      "faqModal"
    );


  modal.classList.add(
    "active"
  );


  document.getElementById(
    "modalTitle"
  ).textContent =

    faq
      ? "Edit FAQ"
      : "Add FAQ";


  document.getElementById(
    "faqId"
  ).value =

    faq?.id ||
    "";


  document.getElementById(
    "category"
  ).value =

    faq?.category ||
    "General";


  document.getElementById(
    "question"
  ).value =

    faq?.question ||
    "";


  document.getElementById(
    "answer"
  ).value =

    faq?.answer ||
    "";


  document.getElementById(
    "sortOrder"
  ).value =

    faq?.sort_order ??
    0;


  publishState =

    faq
      ? faq.is_published === true
      : false;

}



/* =========================================
   CLOSE MODAL
========================================= */

function closeModal() {

  document
    .getElementById(
      "faqModal"
    )
    .classList.remove(
      "active"
    );

}



/* =========================================
   EDIT FAQ
========================================= */

function editFaq(id) {

  const faq =
    faqs.find(
      item =>
        String(item.id) ===
        String(id)
    );


  if (faq) {

    openModal(
      faq
    );

  }

}



/* =========================================
   PUBLISH / UNPUBLISH
========================================= */

async function toggleFaq(
  id,
  publish
) {


  const {
    error
  } = await supabaseClient

    .from("faqs")

    .update({

      is_published:
        publish,

      updated_at:
        new Date().toISOString()

    })

    .eq(
      "id",
      id
    );


  if (error) {

    alert(
      "Unable to update FAQ: " +
      error.message
    );

    return;

  }


  await loadFaqs();

}



/* =========================================
   DELETE FAQ
========================================= */

async function deleteFaq(
  id
) {


  const faq =
    faqs.find(
      item =>
        String(item.id) ===
        String(id)
    );


  if (!faq) {
    return;
  }


  const confirmed =
    confirm(
      `Delete "${faq.question}"?\n\nThis cannot be undone.`
    );


  if (!confirmed) {
    return;
  }


  const {
    error
  } = await supabaseClient

    .from("faqs")

    .delete()

    .eq(
      "id",
      id
    );


  if (error) {

    alert(
      "Unable to delete FAQ: " +
      error.message
    );

    return;

  }


  await loadFaqs();

}



/* =========================================
   FAQ FORM SUBMIT
========================================= */

document
  .getElementById(
    "faqForm"
  )
  .addEventListener(
    "submit",
    async function(event) {


      event.preventDefault();


      const id =
        document.getElementById(
          "faqId"
        ).value;


      const category =
        document.getElementById(
          "category"
        ).value.trim();


      const question =
        document.getElementById(
          "question"
        ).value.trim();


      const answer =
        document.getElementById(
          "answer"
        ).value.trim();


      const sortOrder =
        Number(
          document.getElementById(
            "sortOrder"
          ).value
        ) || 0;


      if (!category) {

        alert(
          "Please enter a question category."
        );

        return;

      }


      if (!question) {

        alert(
          "Please enter a question."
        );

        return;

      }


      if (!answer) {

        alert(
          "Please enter an answer."
        );

        return;

      }


      const clickedButton =
        event.submitter;


      publishState =

        clickedButton &&
        clickedButton.dataset
          .publishState ===
        "true";


      const publishBtn =
        document.getElementById(
          "publishBtn"
        );


      const draftBtn =
        document.getElementById(
          "draftBtn"
        );


      publishBtn.disabled =
        true;


      draftBtn.disabled =
        true;


      clickedButton.textContent =

        publishState
          ? "PUBLISHING..."
          : "SAVING DRAFT...";


      const faqData = {

        category:

          category,

        question:

          question,

        answer:

          answer,

        sort_order:

          sortOrder,

        is_published:

          publishState,

        updated_at:

          new Date().toISOString()

      };


      let result;


      /* UPDATE */

      if (id) {

        result =
          await supabaseClient

            .from("faqs")

            .update(
              faqData
            )

            .eq(
              "id",
              id
            );

      }


      /* INSERT */

      else {

        result =
          await supabaseClient

            .from("faqs")

            .insert(
              faqData
            );

      }


      if (result.error) {

        alert(
          "Unable to save FAQ: " +
          result.error.message
        );


        publishBtn.disabled =
          false;


        draftBtn.disabled =
          false;


        publishBtn.textContent =
          "PUBLISH";


        draftBtn.textContent =
          "SAVE DRAFT";


        return;

      }


      publishBtn.disabled =
        false;


      draftBtn.disabled =
        false;


      publishBtn.textContent =
        "PUBLISH";


      draftBtn.textContent =
        "SAVE DRAFT";


      closeModal();


      await loadFaqs();

    }
  );



/* =========================================
   ADD FAQ
========================================= */

document
  .getElementById(
    "addFaqBtn"
  )
  .addEventListener(
    "click",
    function() {

      openModal();

    }
  );



/* =========================================
   CLOSE BUTTON
========================================= */

document
  .getElementById(
    "closeModal"
  )
  .addEventListener(
    "click",
    closeModal
  );



/* =========================================
   CANCEL BUTTON
========================================= */

document
  .getElementById(
    "cancelBtn"
  )
  .addEventListener(
    "click",
    closeModal
  );



/* =========================================
   CLICK OUTSIDE MODAL
========================================= */

document
  .getElementById(
    "faqModal"
  )
  .addEventListener(
    "click",
    function(event) {

      if (
        event.target ===
        this
      ) {

        closeModal();

      }

    }
  );



/* =========================================
   ESC KEY
========================================= */

document.addEventListener(
  "keydown",
  function(event) {

    if (
      event.key ===
      "Escape"
    ) {

      closeModal();

    }

  }
);



/* =========================================
   LOGOUT
========================================= */

document
  .getElementById(
    "logoutBtn"
  )
  .addEventListener(
    "click",
    async function() {


      await supabaseClient
        .auth
        .signOut();


      window.location.replace(
        "login.html"
      );

    }
  );



/* =========================================
   ESCAPE HTML
========================================= */

function escapeHtml(
  value
) {

  return String(
    value ?? ""
  )

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}



/* =========================================
   START
========================================= */

loadFaqs();


</script>


</body>

</html>
