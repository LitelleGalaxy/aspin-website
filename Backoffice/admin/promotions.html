<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Promotions | ASPIN Admin</title>

  <link rel="stylesheet" href="style.css">

  <style>
    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      gap: 20px;
    }

    .page-header h1 {
      margin: 0;
    }

    .page-header p {
      margin: 8px 0 0;
      color: #999;
    }

    .primary-btn {
      background: #b10d16;
      color: #fff;
      border: 1px solid #d4af37;
      padding: 13px 20px;
      cursor: pointer;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .primary-btn:hover {
      background: #d1111c;
    }

    .secondary-btn {
      background: transparent;
      color: #d4af37;
      border: 1px solid #d4af37;
      padding: 11px 18px;
      cursor: pointer;
      font-weight: 700;
    }

    .secondary-btn:hover {
      background: rgba(212, 175, 55, 0.08);
    }

    .danger-btn {
      background: transparent;
      color: #ff6b6b;
      border: 1px solid #7c2727;
      padding: 10px 15px;
      cursor: pointer;
      font-weight: 700;
    }

    .danger-btn:hover {
      background: rgba(180, 30, 30, 0.15);
    }

    .promotions-list {
      display: grid;
      gap: 18px;
    }

    .promotion-card {
      background: #111;
      border: 1px solid #3a3020;
      display: grid;
      grid-template-columns: 220px 1fr auto;
      min-height: 150px;
    }

    .promotion-image {
      width: 220px;
      height: 150px;
      object-fit: cover;
      background: #080808;
    }

    .promotion-image.placeholder {
      display: flex;
      align-items: center;
      justify-content: center;
      color: #666;
    }

    .promotion-content {
      padding: 20px;
    }

    .promotion-label {
      color: #d4af37;
      font-size: 11px;
      letter-spacing: 2px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .promotion-content h2 {
      margin: 0 0 8px;
      font-size: 20px;
    }

    .promotion-content p {
      color: #aaa;
      margin: 0 0 12px;
      line-height: 1.5;
    }

    .promotion-meta {
      color: #777;
      font-size: 12px;
    }

    .promotion-actions {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 8px;
      padding: 20px;
      min-width: 130px;
    }

    .status {
      display: inline-block;
      padding: 5px 9px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .status.published {
      color: #65e89a;
      border: 1px solid #27643f;
      background: rgba(50, 150, 90, 0.08);
    }

    .status.draft {
      color: #d4af37;
      border: 1px solid #715e21;
      background: rgba(212, 175, 55, 0.06);
    }

    .empty-state {
      border: 1px dashed #3a3020;
      padding: 60px 20px;
      text-align: center;
      color: #777;
    }

    .empty-state h2 {
      color: #ddd;
      margin-bottom: 8px;
    }

    .loading {
      color: #d4af37;
      padding: 30px 0;
    }

    .error-message {
      color: #ff7777;
      background: rgba(150, 20, 20, 0.12);
      border: 1px solid #632323;
      padding: 15px;
      margin-bottom: 20px;
      display: none;
    }

    /* Modal */

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.82);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 9999;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal {
      width: min(700px, 100%);
      max-height: 90vh;
      overflow-y: auto;
      background: #111;
      border: 1px solid #4a3d22;
      padding: 30px;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
    }

    .modal-header h2 {
      margin: 0;
    }

    .close-btn {
      background: transparent;
      border: 0;
      color: #aaa;
      font-size: 25px;
      cursor: pointer;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      margin-bottom: 7px;
      color: #ddd;
      font-size: 12px;
      letter-spacing: 1px;
      font-weight: 700;
    }

    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;
      box-sizing: border-box;
      background: #080808;
      color: #fff;
      border: 1px solid #3a3a3a;
      padding: 12px;
      font-family: inherit;
      outline: none;
    }

    .form-group input:focus,
    .form-group textarea:focus,
    .form-group select:focus {
      border-color: #d4af37;
    }

    .form-group textarea {
      min-height: 110px;
      resize: vertical;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .upload-box {
      border: 1px dashed #5a4a26;
      padding: 18px;
      background: #0a0a0a;
    }

    .image-preview {
      width: 100%;
      max-height: 220px;
      object-fit: contain;
      background: #050505;
      margin-top: 12px;
      display: none;
    }

    .upload-status {
      color: #d4af37;
      font-size: 12px;
      margin-top: 8px;
    }

    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 20px 0;
    }

    .checkbox-row input {
      width: auto;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 25px;
      border-top: 1px solid #292929;
      padding-top: 20px;
    }

    @media (max-width: 800px) {
      .page-header {
        align-items: flex-start;
        flex-direction: column;
      }

      .promotion-card {
        grid-template-columns: 1fr;
      }

      .promotion-image {
        width: 100%;
        height: 200px;
      }

      .promotion-actions {
        flex-direction: row;
        flex-wrap: wrap;
      }

      .form-row {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <div class="admin-layout">

    <!-- SIDEBAR -->
    <aside class="sidebar">

      <div class="brand">
        <div class="brand-mark">A</div>

        <div>
          <div class="brand-name">ASPIN</div>
          <div class="brand-sub">ADMIN</div>
        </div>
      </div>

      <nav class="admin-nav">
        <a href="index.html">Dashboard</a>
        <a href="promotions.html" class="active">Promotions</a>
        <a href="media.html">Media</a>
        <a href="faqs.html">FAQs</a>
        <a href="payments.html">Payments</a>
        <a href="subscribers.html">Subscribers</a>
        <a href="analytics.html">Analytics</a>
        <a href="settings.html">Settings</a>
      </nav>

      <button id="logoutBtn" class="logout-btn">
        LOG OUT
      </button>

    </aside>


    <!-- MAIN -->
    <main class="admin-main">

      <header class="page-header">

        <div>
          <div class="eyebrow">ASPIN.SITE</div>
          <h1>Promotions</h1>
          <p>Manage the promotional content displayed on the website.</p>
        </div>

        <button id="addPromotionBtn" class="primary-btn">
          + ADD PROMOTION
        </button>

      </header>


      <div id="errorMessage" class="error-message"></div>

      <div id="loading" class="loading">
        Loading promotions...
      </div>

      <section id="promotionsList" class="promotions-list"></section>

    </main>

  </div>


  <!-- ADD / EDIT MODAL -->

  <div id="promotionModal" class="modal-overlay">

    <div class="modal">

      <div class="modal-header">
        <h2 id="modalTitle">Add Promotion</h2>

        <button id="closeModalBtn" class="close-btn">
          ×
        </button>
      </div>


      <form id="promotionForm">

        <input type="hidden" id="promotionId">


        <div class="form-group">
          <label for="title">PROMOTION TITLE</label>

          <input
            id="title"
            type="text"
            placeholder="September Welcome Bonus"
            required
          >
        </div>


        <div class="form-group">
          <label for="description">DESCRIPTION</label>

          <textarea
            id="description"
            placeholder="Enter the promotion description..."
          ></textarea>
        </div>


        <div class="form-group">

          <label>PROMOTION IMAGE</label>

          <div class="upload-box">

            <input
              id="imageFile"
              type="file"
              accept="image/jpeg,image/png,image/webp,image/svg+xml"
            >

            <div id="uploadStatus" class="upload-status"></div>

            <img
              id="imagePreview"
              class="image-preview"
              alt="Promotion preview"
            >

          </div>

        </div>


        <div class="form-row">

          <div class="form-group">
            <label for="label">LABEL</label>

            <input
              id="label"
              type="text"
              value="FEATURED"
              placeholder="FEATURED"
            >
          </div>


          <div class="form-group">
            <label for="buttonText">BUTTON TEXT</label>

            <input
              id="buttonText"
              type="text"
              value="LEARN MORE"
              placeholder="LEARN MORE"
            >
          </div>

        </div>


        <div class="form-group">

          <label for="buttonUrl">BUTTON URL</label>

          <input
            id="buttonUrl"
            type="url"
            value="https://aspin.vip/"
            placeholder="https://aspin.vip/"
          >

        </div>


        <div class="form-group">

          <label for="sortOrder">SORT ORDER</label>

          <input
            id="sortOrder"
            type="number"
            value="0"
            min="0"
          >

        </div>


        <label class="checkbox-row">

          <input
            id="isPublished"
            type="checkbox"
          >

          <span>
            Publish this promotion on ASPIN.SITE
          </span>

        </label>


        <div class="modal-actions">

          <button
            type="button"
            id="cancelBtn"
            class="secondary-btn"
          >
            CANCEL
          </button>

          <button
            type="submit"
            class="primary-btn"
          >
            SAVE PROMOTION
          </button>

        </div>

      </form>

    </div>

  </div>


  <!-- SUPABASE -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="../supabase.js"></script>


  <script>

    let currentPromotions = [];
    let editingPromotion = null;


    const modal = document.getElementById("promotionModal");
    const form = document.getElementById("promotionForm");

    const titleInput = document.getElementById("title");
    const descriptionInput = document.getElementById("description");
    const labelInput = document.getElementById("label");
    const buttonTextInput = document.getElementById("buttonText");
    const buttonUrlInput = document.getElementById("buttonUrl");
    const sortOrderInput = document.getElementById("sortOrder");
    const publishedInput = document.getElementById("isPublished");
    const imageFileInput = document.getElementById("imageFile");

    const imagePreview = document.getElementById("imagePreview");
    const uploadStatus = document.getElementById("uploadStatus");

    const promotionsList = document.getElementById("promotionsList");
    const loading = document.getElementById("loading");
    const errorMessage = document.getElementById("errorMessage");


    function showError(message) {

      errorMessage.textContent = message;
      errorMessage.style.display = "block";

    }


    function hideError() {

      errorMessage.style.display = "none";

    }


    async function checkAuth() {

      const {
        data: { session }
      } = await supabaseClient.auth.getSession();


      if (!session) {

        window.location.href = "login.html";
        return false;

      }


      return true;

    }


    async function loadPromotions() {

      hideError();

      loading.style.display = "block";


      const {
        data,
        error
      } = await supabaseClient
        .from("promotions")
        .select("*")
        .order("sort_order", { ascending: true })
        .order("created_at", { ascending: false });


      loading.style.display = "none";


      if (error) {

        showError(
          "Unable to load promotions: " + error.message
        );

        return;

      }


      currentPromotions = data || [];

      renderPromotions();

    }


    function renderPromotions() {

      promotionsList.innerHTML = "";


      if (currentPromotions.length === 0) {

        promotionsList.innerHTML = `
          <div class="empty-state">
            <h2>No promotions yet</h2>
            <p>Create your first promotion to display it on ASPIN.SITE.</p>
          </div>
        `;

        return;

      }


      currentPromotions.forEach(promotion => {

        const card = document.createElement("article");

        card.className = "promotion-card";


        const image = promotion.image_url
          ? `<img
              class="promotion-image"
              src="${escapeHtml(promotion.image_url)}"
              alt="${escapeHtml(promotion.title)}"
            >`
          : `<div class="promotion-image placeholder">
              NO IMAGE
            </div>`;


        const status = promotion.is_published
          ? `<span class="status published">PUBLISHED</span>`
          : `<span class="status draft">DRAFT</span>`;


        card.innerHTML = `

          ${image}

          <div class="promotion-content">

            <div class="promotion-label">
              ${escapeHtml(promotion.label || "FEATURED")}
            </div>

            <h2>
              ${escapeHtml(promotion.title)}
            </h2>

            <p>
              ${escapeHtml(
                promotion.description || "No description."
              )}
            </p>

            ${status}

          </div>


          <div class="promotion-actions">

            <button
              class="secondary-btn"
              onclick="editPromotion(${promotion.id})"
            >
              EDIT
            </button>

            <button
              class="danger-btn"
              onclick="deletePromotion(${promotion.id})"
            >
              DELETE
            </button>

          </div>

        `;


        promotionsList.appendChild(card);

      });

    }


    function escapeHtml(value) {

      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    function openAddModal() {

      editingPromotion = null;

      document.getElementById("modalTitle").textContent =
        "Add Promotion";

      form.reset();

      document.getElementById("promotionId").value = "";

      labelInput.value = "FEATURED";

      buttonTextInput.value = "LEARN MORE";

      buttonUrlInput.value = "https://aspin.vip/";

      sortOrderInput.value = "0";

      publishedInput.checked = false;

      imagePreview.style.display = "none";

      imagePreview.src = "";

      uploadStatus.textContent = "";

      modal.classList.add("active");

    }


    window.editPromotion = function(id) {

      const promotion = currentPromotions.find(
        item => item.id === id
      );


      if (!promotion) return;


      editingPromotion = promotion;


      document.getElementById("modalTitle").textContent =
        "Edit Promotion";


      document.getElementById("promotionId").value =
        promotion.id;


      titleInput.value =
        promotion.title || "";


      descriptionInput.value =
        promotion.description || "";


      labelInput.value =
        promotion.label || "FEATURED";


      buttonTextInput.value =
        promotion.button_text || "LEARN MORE";


      buttonUrlInput.value =
        promotion.button_url || "https://aspin.vip/";


      sortOrderInput.value =
        promotion.sort_order ?? 0;


      publishedInput.checked =
        promotion.is_published === true;


      imageFileInput.value = "";


      uploadStatus.textContent = "";


      if (promotion.image_url) {

        imagePreview.src = promotion.image_url;

        imagePreview.style.display = "block";

      } else {

        imagePreview.src = "";

        imagePreview.style.display = "none";

      }


      modal.classList.add("active");

    };


    async function uploadImage(file) {

      if (!file) return null;


      if (file.size > 10 * 1024 * 1024) {

        throw new Error(
          "Image must be smaller than 10 MB."
        );

      }


      const allowedTypes = [
        "image/jpeg",
        "image/png",
        "image/webp",
        "image/svg+xml"
      ];


      if (!allowedTypes.includes(file.type)) {

        throw new Error(
          "Only JPG, PNG, WEBP, and SVG images are allowed."
        );

      }


      uploadStatus.textContent =
        "Uploading image...";


      const extension =
        file.name.split(".").pop().toLowerCase();


      const filename =
        `${Date.now()}-${crypto.randomUUID()}.${extension}`;


      const path =
        `promotions/${filename}`;


      const {
        error
      } = await supabaseClient.storage
        .from("media")
        .upload(path, file, {
          cacheControl: "3600",
          upsert: false
        });


      if (error) {

        throw error;

      }


      const {
        data
      } = supabaseClient.storage
        .from("media")
        .getPublicUrl(path);


      uploadStatus.textContent =
        "Image uploaded successfully.";


      return data.publicUrl;

    }


    form.addEventListener("submit", async function(event) {

      event.preventDefault();

      hideError();


      try {

        const id =
          document.getElementById("promotionId").value;


        let imageUrl =
          editingPromotion?.image_url || null;


        const selectedFile =
          imageFileInput.files[0];


        if (selectedFile) {

          imageUrl =
            await uploadImage(selectedFile);

        }


        const promotionData = {

          title: titleInput.value.trim(),

          description:
            descriptionInput.value.trim() || null,

          image_url:
            imageUrl,

          button_text:
            buttonTextInput.value.trim() || "LEARN MORE",

          button_url:
            buttonUrlInput.value.trim() ||
            "https://aspin.vip/",

          label:
            labelInput.value.trim() || "FEATURED",

          sort_order:
            Number(sortOrderInput.value) || 0,

          is_published:
            publishedInput.checked,

          updated_at:
            new Date().toISOString()

        };


        let result;


        if (id) {

          result = await supabaseClient
            .from("promotions")
            .update(promotionData)
            .eq("id", id);

        } else {

          result = await supabaseClient
            .from("promotions")
            .insert(promotionData);

        }


        if (result.error) {

          throw result.error;

        }


        closeModal();

        await loadPromotions();

      }

      catch (error) {

        showError(
          "Unable to save promotion: " +
          error.message
        );

      }

    });


    window.deletePromotion = async function(id) {

      const promotion =
        currentPromotions.find(
          item => item.id === id
        );


      if (!promotion) return;


      const confirmed = confirm(
        `Delete "${promotion.title}"?\n\nThis cannot be undone.`
      );


      if (!confirmed) return;


      hideError();


      const {
        error
      } = await supabaseClient
        .from("promotions")
        .delete()
        .eq("id", id);


      if (error) {

        showError(
          "Unable to delete promotion: " +
          error.message
        );

        return;

      }


      /*
       * Delete the associated image if one exists.
       * The database record is removed first.
       */

      if (promotion.image_url) {

        try {

          const marker =
            "/storage/v1/object/public/media/";

          const index =
            promotion.image_url.indexOf(marker);


          if (index !== -1) {

            const path =
              promotion.image_url.substring(
                index + marker.length
              );


            await supabaseClient.storage
              .from("media")
              .remove([path]);

          }

        }

        catch (storageError) {

          console.warn(
            "Promotion deleted, but image cleanup failed:",
            storageError
          );

        }

      }


      await loadPromotions();

    };


    function closeModal() {

      modal.classList.remove("active");

      editingPromotion = null;

      form.reset();

      imagePreview.style.display = "none";

      imagePreview.src = "";

      uploadStatus.textContent = "";

    }


    document
      .getElementById("addPromotionBtn")
      .addEventListener(
        "click",
        openAddModal
      );


    document
      .getElementById("closeModalBtn")
      .addEventListener(
        "click",
        closeModal
      );


    document
      .getElementById("cancelBtn")
      .addEventListener(
        "click",
        closeModal
      );


    modal.addEventListener("click", function(event) {

      if (event.target === modal) {

        closeModal();

      }

    });


    imageFileInput.addEventListener("change", function() {

      const file =
        this.files[0];


      if (!file) return;


      const reader =
        new FileReader();


      reader.onload = function(event) {

        imagePreview.src =
          event.target.result;

        imagePreview.style.display =
          "block";

      };


      reader.readAsDataURL(file);

    });


    document
      .getElementById("logoutBtn")
      .addEventListener(
        "click",
        async function() {

          await supabaseClient.auth.signOut();

          window.location.href =
            "login.html";

        }
      );


    (async function init() {

      const authenticated =
        await checkAuth();


      if (!authenticated) return;


      await loadPromotions();

    })();

  </script>

</body>
</html>
